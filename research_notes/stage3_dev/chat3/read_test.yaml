- doc_id: "wiki-ko-chuncheon"
  sections:
    - heading: "## 역사"
      next_line: "춘천 지역은 고대 부족 국가인 맥국의 수도로서 후일 고구려, 신라에 차례로 정복되었으며, 637년(선덕여왕 6년)에 우수주(牛首州)라 부르고 군주(君主)를 두었다."
    - heading: "## 지리"
      next_line: "춘천시는 강원특별자치도의 서북부에 있으며, 북한강 지류, 소양강 본류와의 합류점에 가까운 남안에 위치한다. 동쪽으로 인제군, 양구군, 서쪽으로 경기도 가평군, 북쪽으로 화천군, 남쪽으로 홍천군과 접한다."
    - heading: "## 지질"
      next_line: "춘천시가 포함된 춘천 분지는 분지 내부의 화강암이 주변의 편마암보다 더 많은 침식을 받아 형성된 전형적인 차별 침식 분지이다. 춘천시 동면 월곡리에는 선캄브리아기 용두리편마암복합체 내에 한국의 유일한 연옥 광산인 춘천 옥광산이 발달한다."
    - heading: "## 행정 구역"
      next_line: "춘천시의 행정 구역은 15동 1읍 9면이다. 면적은 1,116.35 km2이고, 이 중 시내 동 면적은 52.66 km2이다. 인구는 2017년 3월 31일 기준으로 116,273세대, 282,439명이다. 성별 인구는 남성 139,427명, 여성 144,092명이다."
    - heading: "## 인구"
      next_line: "연도별 인구"
    - heading: "## 정치"
      next_line: "### 국회의원"
    - heading: "## 행정"
      next_line: "### 춘천시장"
    - heading: "## 경제"
      next_line: "### 농업"
    - heading: "## 문화·관광"
      next_line: "해마다 5월에는 소양제가 열린다. 호반의 도시라는 특성을 살리는 다양한 행사가 펼쳐지는데, 봉의산제, 민속놀이, 수상불꽃놀이, 국제레저대회, 국악경영 등이 진행된다."
    - heading: "## 교통"
      next_line: "과거, 서울과 춘천 사이를 잇는 철도 노선인 경춘선이 있어 수도권에 접근하는 교통이 비교적 편리한 편이었으며, 2010년 12월 21일, 경춘선이 복선 전철화 개량사업이 완료됨과 동시에 수도권 전철 노선으로 개편되면서, 서울로의 접근성이 이전과 비교할 수 없을 정도로 개선되었다."
    - heading: "## 스포츠"
      next_line: "### 스포츠 팀"
    - heading: "## 교육 기관"
      next_line: "| 종합대학 | 국공립대학교 | 강원대학교 | 춘천교육대학교 | 한국방송통신대학교 강원지역대학 |"
    - heading: "## 방송 및 언론"
      next_line: "- KBS춘천방송총국"
    - heading: "## 국방"
      next_line: "대한민국 육군 2군단 본부 및 그 예하 부대가 위치한다."
    - heading: "## 자매 도시"
      next_line: "### 자매결연 도시"
- doc_id: "wiki-ko-gwangju"
  sections:
    - heading: "## 역사"
      next_line: "### 지명"
    - heading: "## 지리"
      next_line: "### 인문지리"
    - heading: "## 행정 구역"
      next_line: "광주광역시에는 5개 자치구(광산구, 동구, 서구, 북구, 남구)와 90개 동이 있다. 2015년 12월 31일 기준 인구는 580,427세대, 1,472,199명이다. 면적은 501.18km2이다."
    - heading: "## 인구"
      next_line: "광주는 전라도 지역의 행정과 교통의 중심지로서, 조선 시대 이래 고을과 장시(場市)가 발달하였으나 인구는 수만 명 수준에 머물렀다. 호남의 곡창지대를 배후에 두었으나, 본격적인 도시적 성장은 근대 이후에야 시작되었다."
    - heading: "## 주요 기관"
      next_line: "광주는 산지와 평야의 2개 이질 지역 접촉지대에 발달한 군사·행정상 및 교역상 좋은 위치에 자리잡고 있다. 충장로·금남로 일대가 상업의 중심지이며 ‘교육도시’라고 일컬을 정도로 대학 및 각급 학교가 많아 전남 문화의 중심지로 되어 있다."
    - heading: "## 경제"
      next_line: "2012년 광주광역시의 지역내총생산(GRDP)은 26조 7,700억 원이며, 실질성장률은 0.7%이다."
    - heading: "## 문화"
      next_line: "### 관광"
    - heading: "## 스포츠"
      next_line: "프로 야구단인 KIA 타이거즈, K리그의 광주 FC가 광주광역시를 연고지로 한다."
    - heading: "## 교육"
      next_line: "### 초중등교육기관"
    - heading: "## 교통"
      next_line: "### 도로"
    - heading: "## 국제 교류"
      next_line: "자매도시"
- doc_id: "wiki-ko-gyeongju"
  sections:
    - heading: "## 역사"
      next_line: "삼한 시대에 '사로국'이라는 이름으로 비(非)한국 문헌에 처음 등장한다. 한국의 기록(아마도 신라의 왕조 실록을 기반으로 한 자료)에 따르면, 사로국은 기원전 57년 경주 지역의 여섯 개 마을이 박혁거세를 중심으로 통합되며 세워졌다고 한다."
    - heading: "## 지리"
      next_line: "### 위치"
    - heading: "## 정치"
      next_line: "현직 경주시장은 제7회 전국동시지방선거를 통해 당선된 국민의힘 소속의 주낙영이다. 대한민국 국회에서는 경주시라는 단일 선거구로 묶여 있으며, 현직 국회의원은 대한민국 제21대 국회의원 선거에서 당선된 김석기 의원이다."
    - heading: "## 행정 구역"
      next_line: "경주시의 행정구역 면적은 1,324.41km2로, 경상북도에서 안동시에 이어 두 번째로 넓은 기초자치단체이다. 도시 지역인 시내 행정동(洞) 면적은 221.3km2이다."
    - heading: "## 인구"
      next_line: "신라시대 경주의 인구는 삼국유사에 의하면 \"신라의 전성기에 도읍(경주)에는 178,936호가 있었다.(新羅全盛之時 京中十七萬 八千九百三十六戶)라 하여 90만 명에서 120만 명으로 추정할 수 있다."
    - heading: "## 문화"
      next_line: "### 문화유산"
    - heading: "## 관광"
      next_line: "2009년에 선덕여왕을 소재로 한 사극 드라마의 신라밀레니엄파크 촬영지로 각광을 받았다. 같은 해, 6월 8일에 천년의 꿈, 경주의 빛 타임캡슐 매설식을 가졌다."
    - heading: "## 경제"
      next_line: "생산 취업 인구 중 농업 인구와 서비스 부문에 종사하는 인구가 많은데, 이를 농업 도시로서의 성격과 관광지로서의 지위가 높은 것을 보여 주고 있다. 경지 면적은 전체 면적의 약 19%로 적으나, 도시 근교 농업과 축산업이 발달했다."
    - heading: "## 교육"
      next_line: "조선시대부터 이 지역에는 경주향교를 비롯해 서악서원, 옥산서원도 있다. 1907년에 개교한 공립 경주보통학교가 있으며, 일제강점기에 여러 재단법인 수봉교육재단 설립의건 인가의 경주공립고등보통학교 가 세워졌다."
    - heading: "## 스포츠"
      next_line: "| 리그명 | 팀명 | 창단연도 | 홈 경기장 |"
    - heading: "## 교통"
      next_line: "### 철도 교통"
    - heading: "## 경주 8색"
      next_line: "- 화랑 적색(赤) ■"
    - heading: "## 공공 기관"
      next_line: "- 경주시청"
    - heading: "## 대형마트"
      next_line: "- 홈플러스 경주점"
    - heading: "## 영화관"
      next_line: "- 롯데시네마 경주황성"
    - heading: "## 자매 도시"
      next_line: "경주시의 자매결연, 우호교류 도시는 다음과 같다."
