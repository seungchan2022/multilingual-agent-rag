- doc_id: "wiki-ko-suwon"
  sections:
    - heading: "## 역사"
      next_line: "수원시는 선사 시대 때부터 사람이 살던 곳으로, 지동과 이의동에서 중기 구석기 시대 유물이 발견되었고, 신석기 시대, 청동기 시대, 원삼국 시대와 유적도 다수 있다."
    - heading: "## 지리와 지질"
      next_line: "수원시는 경기도 중남부에 있으며 동쪽은 용인시 기흥구 및 수지구에, 서쪽은 안산시 상록구와 화성시 봉담읍 및 매송면에, 남쪽은 화성시 병점 및 동탄에, 북쪽은 의왕시에 접하고 있다."
    - heading: "## 인구통계"
      next_line: "수원시의 인구는 2023년 기준 537,078세대 1,233,431명이다. 대한민국의 기초자치단체 가운데는 가장 인구 수가 많으며 울산광역시의 2025년 3월 기준 인구 1,122,221명보다 많다."
    - heading: "## 산업과 경제"
      next_line: "수원시의 명목 지역내총생산은 2022년 기준 약 41조 원으로 경기도 전체의 약 7 %를 차지하고 있다. 2016년 기준 지역총부가가치는 약 55조 5천억 원이다."
    - heading: "## 도시 구조"
      next_line: "### 주거"
    - heading: "## 행정"
      next_line: "### 행정 구역"
    - heading: "## 교육"
      next_line: "- 경기도교육청"
    - heading: "## 관광"
      next_line: "수원에는 북쪽 광교산과 서쪽 칠보산, 동쪽 청명산이 위치해 있어, 주민들의 휴식처 역할을 한다. 파장동 경수간 도로변의 지지대와 노송지대, 서쪽의 화서동 서호축만제와 서호생태수자원센터, 동쪽의 이의동 광교신도시 광교호수공원이 있다."
    - heading: "## 스포츠"
      next_line: "### 축구"
    - heading: "## 교통"
      next_line: "영동고속도로와 용인서울고속도로, 평택파주고속도로가 수원시를 지나는 주요 고속도로이다. 경부고속도로가 수원시 근방인 용인시 기흥구를 지난다."
    - heading: "## 교류 도시"
      next_line: "| 자매결연도시 | 지방자치단체 | 지방자치단체 |"