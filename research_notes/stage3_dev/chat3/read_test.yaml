      next_line: "The area that Busan now occupies was inhabited during the Neolithic period. Artifacts dating to this period discovered near the coast include stone tools, pottery, sea shells, and animal bones."
    - heading: "## Geography"
      next_line: "Busan is located on the southeastern tip of the Korean Peninsula. It is located on the coast, which determined the development of the whole city itself."
    - heading: "## Administrative divisions"
      next_line: "In 1957, Busan adopted a division system with the creation of six gu (districts): Busanjin District, Dong District, Dongnae District, Jung District, Seo District, and Yeongdo District."
    - heading: "## Economy"
      next_line: "Busan is the second largest city in Korea, a maritime logistics hub, and a world-class mega port, it acts as a gateway to the Eurasian continent."
    - heading: "## Education"
      next_line: "### Universities with graduate schools"
