    - heading: "## 교통"
      next_line: "국도 17호, 21호, 26호선 등이 시내를 통과하며, 1번 국도, 27번 국도는 시내를 우회한다. 여의동2가에 있는 전주 나들목이나 완주군 이서면에 있는 서전주 나들목에서 호남고속도로에,"
    - heading: "## 교육"
