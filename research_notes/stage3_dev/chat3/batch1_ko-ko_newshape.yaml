# 묶음 1(batch1_ko-ko.yaml, 옛 모양)을 지금의 후보 모양으로 옮긴 복사본. Claude가 만들었다(2026-10-17).
# 쓰임: 검사(check_candidates.py) → 유형 확인 글(make_type_check.py) → 카드(make_cards.py)를 실제 후보 12개로 끝까지 돌려 보는 데만 쓴다. 확정본이 아니다.
# 질문·정답·사실·근거 구절은 원본 그대로다. 바꾼 것은 세 가지다.
# - in_answer: DECISIONS.md 미정 목록 Codex 지적 처리 줄의 값. c-007은 구별 세대 수 5개 false·결론 true, c-008은 890명·452명 false·1342명 true, 나머지는 모두 true.
# - opposite_check: 원본의 찾을 말(term)만 남기고 걸린 곳(hits)은 뺐다. 걸린 곳은 프로그램이 찾는다.
# - same_language_check: 원본에 없던 칸이라 Claude가 채웠다. 대조 기록(audit_batch1_ko-ko.md)에 나오는 찾을 말을 먼저 쓰고 모자라면 근거 구절의 말을 더했다.
#   c-012의 `완산`은 59곳에 걸려 거절되어 `완산의 별칭`으로 바꿨다.
# c-009는 묶음 1에서 폐기한 후보(알려진 부딪히는 값)라 검사에서 실패해야 맞다.
