      next_line: "### 박물관"
    - heading: "## 경제"
      next_line: "### 전주시 주요기업"
    - heading: "## 교통"
      next_line: "국도 17호, 21호, 26호선 등이 시내를 통과하며, 1번 국도, 27번 국도는 시내를 우회한다. 여의동2가에 있는 전주 나들목이나 완주군 이서면에 있는 서전주 나들목에서 호남고속도로에, 완주군 용진읍의 완주 나들목이나 소양면의 소양 나들목에서 새만금포항고속도로지선에, 금상동에 있는 동전주 나들목과 완주군 상관면에 있는 상관 나들목에서 순천완주고속도로에 진입할 수 있다."
    - heading: "## 교육"
      next_line: "전주시 일반고등학교는 고등학교 평준화 정책을 시행하고 있으며, 매년 12월 중학교 졸업예정자/졸업자 및 고등학교 입학자격 획득자에 대해 내신성적으로 선발한다. 특성화 고등학교 및 기타 고등학교는 학교장의 추천을 통해 내신성적으로 입학인원을 선발한다."
    - heading: "## 스포츠"
      next_line: "프로축구 K리그1 소속인 전북 현대 모터스가 전주월드컵경기장을 홈구장으로 삼고 있으며, K4리그 소속인 전북 현대 모터스 B와 전주시민축구단이 각각 전주월드컵경기장 보조구장과 전주종합경기장을 홈구장으로 삼고 있다."
    - heading: "## 국제 교류"
      next_line: "### 자매 도시"
- doc_id: wiki-ko-sejong
  sections:
    - heading: "## 역사"
      next_line: "### 세종특별자치시 출범 이전"
    - heading: "## 행정 구역"
      next_line: "세종특별자치시는 하위 행정구역으로 시·군·구의 기초지방자치단체를 두지 않는 단층제 광역지방자치단체로 시의 행정구역은 1읍 9면 14행정동 18법정동 122리로 구성되어 있다."
    - heading: "## 사법·행정 기관"
      next_line: "2012년 7월 1일 출범 당시 인구는 100,700여 명이었고, 광역지방자치단체의 지위로 출범한 세종특별자치시의 성격으로 인하여 세종특별자치시교육청도 함께 출범하였다. 대전지방법원, 대전지방검찰청 직속 관할 지역으로 그대로 유지하되, 대전지방법원 산하 연기군법원은 세종시법원으로 명칭이 변경되었으며, 충남지방경찰청 소속 연기경찰서는 세종경찰서로 개칭되었다. 2019년 6월 25일 세종지방경찰청이 설치되었다. 2021년 1월 1일 세종별자치시지방경찰청이 세종특별자치시경찰청으로 개칭했다. 2021년 10월 4일 세종남부경찰서가 개청하여 기존 세종경찰서는 세종북부경찰서로 명칭이 변경되었다."
    - heading: "## 인구"
      next_line: "세종특별자치시는 2012년 7월 1일 공식 출범한 대한민국의 행정중심복합도시로서, 충청남도 연기군 전역과 공주시, 청원군, 대전광역시 일부 지역을 편입하여 설치되었다. 출범 이후 세종시는 정부 부처 및 공공기관의 이전과 함께 인구가 급격히 증가하며 새로운 도시로서의 기반을 마련하였다."
    - heading: "## 이전 기관"
      next_line: "### 중앙행정기관"
    - heading: "## 교통"
      next_line: "### 교통 체계"
    - heading: "## 기반시설"
      next_line: "대전광역시에서 행정중심복합도시까지 12.7km의 물길공사를 완료하고 상수관로를 연결하여, 안정적인 수돗물 공급이 이루어지고 있다. 세종시는 1일 6만 톤의 대전광역시 수돗물을 공급받게 된다."
