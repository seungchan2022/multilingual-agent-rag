- doc_id: wiki-en-andong
  sections:
    - heading: "## History"
      next_line: "Around 1 BC, Andong was founded by the Jinhan people, and it was known as Gochang. During the Three Kingdoms period, the area was controlled by the Silla kingdom. The Battle of Gochang in 930 was fought here between Hubaekje forces and the Goryeo army led by Wanggeon, who won control of the city and renamed it Andong."
    - heading: "## Administrative divisions"
      next_line: "Andong is divided into 1 eup, 13 myeon and 10 dong. The following is a list of eup, myeon and dong:"
    - heading: "## Local specialty foods"
      next_line: "Andong has famous local foods that originated in the city such as heotjesabap, Andong jjimdak, Andong soju (a rice wine), Andong sikhye (a punch), Geonjin guksu (a noodle dish), and salted mackerel."
    - heading: "## Culture"
      next_line: "### Museums"
    - heading: "## Architecture"
      next_line: "### Historical"
    - heading: "## Special product"
      next_line: "- Wol Young Yakgwa"
    - heading: "## Education"
      next_line: "- Andong Manner School"
    - heading: "## Transport"
      next_line: "### Air"
    - heading: "## Sports"
      next_line: "- Andong Gymnasium"
    - heading: "## Visitor attractions in Andong"
      next_line: "The Hahoe Folk Village is perhaps the most notable folk village in South Korea. This village is listed by the South Korean government with UNESCO as a World Heritage site with Yangdong Folk Village in 2010."
    - heading: "## Festival"
      next_line: "- Andong International Mask Dance Festival"
    - heading: "## Climate"
      next_line: "Andong has a humid continental climate (Köppen: Dwa), but can be considered a borderline humid subtropical climate (Köppen: Cwa) using the −3 °C (27 °F) isotherm. The city is located in the mountainous region of central South Korea and is part of the temperate climate. Temperatures vary widely, fog is high at 79 days per year, seasonal winds are northwest in winter and northwest in summer."
    - heading: "## Sister cities"
      next_line: "Andong has a sister city relationship with:"
    - heading: "## People from Andong"
      next_line: "- Cho Yoon-jeong (born 1979), tennis player"
- doc_id: wiki-en-busan
  sections:
    - heading: "## Names"
      next_line: "The name \"Busan\" is the Revised Romanization of the city's name. The name 부산 has been recorded since the late 15th century. \"Busan\" officially replaced the earlier McCune–Reischauer romanization Pusan in 2000. During the Japanese colonial period, the Japanese reading of the city's name was \"Fuzan\" which may have remained in the maps that Americans used during the Korean war."
    - heading: "## History"
      next_line: "The area that Busan now occupies was inhabited during the Neolithic period. Artifacts dating to this period discovered near the coast include stone tools, pottery, sea shells, and animal bones. Fishing was a primary food source for people of this period. Bronze Age artifacts have been uncovered further inland. By this period agriculture was being practiced."
    - heading: "## Geography"
      next_line: "Busan is located on the southeastern tip of the Korean Peninsula. It is located on the coast, which determined the development of the whole city itself. The distance from Busan to Seoul is about 314 km (195 mi). Busan borders low mountains to the north and west, and the Korea Strait to the south and east. The Nakdong River Delta is located on the west side of the city, and Geumjeongsan, the highest mountain in the city, is on the north. The Nakdong River, South Korea's longest river, flows through the west and empties into the Korea Strait. The southeastern region, called Yeongnam in Korea, encompasses both Gyeongsang Provinces and 3 metropolitan cities of Busan, Daegu and Ulsan. Ulsan lies northeast of Busan."
    - heading: "## Administrative divisions"
      next_line: "In 1957, Busan adopted a division system with the creation of six gu (districts): Busanjin District, Dong District, Dongnae District, Jung District, Seo District, and Yeongdo District. Today, Busan has divided into fifteen gu and one gun (county)."
    - heading: "## Economy"
      next_line: "Busan is the second largest city in Korea, a maritime logistics hub, and a world-class mega port, it acts as a gateway to the Eurasian continent. In 2022, the maritime city recorded a GRDP of KRW 104 trillion with a per capita GRDP of KRW 39.6 million. As of 2023, the city's economy is primarily made up of the service industry (75.8%), manufacturing (17.4%), and agriculture & fisheries (0.5%)."
    - heading: "## Education"
      next_line: "### Universities with graduate schools"
    - heading: "## Culture and attractions"
      next_line: "Busan features a variety of antique and souvenir shops, restaurants, attractions and accommodations."
    - heading: "## Demographics"
      next_line: "Historical population"
    - heading: "## Sports"
      next_line: "The city planned to bid for the 2020 Summer Olympics, but withdrew after the 2018 Winter Olympics were awarded to Pyeongchang, also located in South Korea. The 2020 Summer Olympics were eventually awarded to Tokyo. It considered bidding to host the 2032 Summer Olympics."
    - heading: "## Festivals and events"
      next_line: "Busan celebrates festivals all year round."
    - heading: "## Medical facilities"
      next_line: "Busan has many hospitals and clinics. Many cosmetic surgery, dermatological, ophthalmic, and dental clinics are concentrated in Seomyeon medical street."
    - heading: "## Transportation"
      next_line: "### Bus"
    - heading: "## International relations"
      next_line: "### Sister cities"
    - heading: "## Notable people"
      next_line: "- Ahn Bohyun (born 1988), actor"
- doc_id: wiki-en-cheonan
  sections:
    - heading: "## History"
      next_line: "Cheonan has always been a major transportation hub of Korea because of its proximity to Seoul and its location near a gap in the eastern mountain range (Charyeong Range) that allows passage through to the major southeast centers of Daegu and Busan. Cheonan's Samgeori (meaning \"3-way intersection\") park has been noted as a strategic point of transportation and a place where culture has spread for a long time. It is the place where Samnamdaero, which starts in Seoul, parts, leading one branch of the road through to the south-eastern Yeongnam region (which includes Gimcheon, Daegu, Gyeongju and Dongnae), and leading the other through Gongju and Nonsan to the Honam region (which includes Jeonju, Gwangju, Suncheon, and Yeosu)."
    - heading: "## Geography"
      next_line: "The city is flanked to the east by the Charyeong Mountains, and spills out over plains and rolling hills to the west. Some of the mountains in the city's vicinity include Malloesan (611m), Seonggeosan (579m), Taejosan (422m), Heukseongsan (519m), Gwangdeoksan (699m), and Manggyeongsan (600m). The city itself is generally flat, with only a few areas, such as Anseon-dong, that are built up on hilly terrain."
    - heading: "## Symbols"
      next_line: "- City Tree: Weeping willow"
    - heading: "## Education"
      next_line: "The city has been designated the high tech headquarters for Korea. A number of colleges and universities are located there, including:"
    - heading: "## Cultural infrastructure"
      next_line: "### Museums"
    - heading: "## Transportation"
      next_line: "The city is very well-connected to Seoul by road but also by train through two train stations. The first is Cheonan Station and the second, (served by the KTX high speed railway) is Cheonan-Asan Station. Different areas in Cheonan are also served by Seoul Subway Line 1."
    - heading: "## Economy"
      next_line: "The local economy is fuelled to a great extent by tech sector companies in the area. Large national corporations such as Samsung, LG Group, Corning Inc., and several technology companies all have operations in Cheonan. The large number of universities also contributes to an influx of spending, as students from around Korea flock here for eight months of the year."
    - heading: "## Administrative districts and divisions"
      next_line: "Cheonan is divided into 2 gu, and 16 administrative dong (subdivided into 30 distinct legal dong), 4 eup and 8 myeon."
    - heading: "## Population diversity"
      next_line: "Even with scores of Korean students graduating from the many tech programs at local universities, the demand for tech sector employees is still very high, and much of that demand is filled by foreign employees. The city is now home to a large foreign population, which has tripled over the past 5 years. There are more than 9,000 foreigners residing in the Cheonan area."
    - heading: "## Twin towns – sister cities"
      next_line: "Cheonan is twinned with:"
    - heading: "## Notable people from Cheonan"
      next_line: "- Kim San-ho, South Korean actor"
- doc_id: wiki-en-cheongju
  sections:
    - heading: "## History"
      next_line: "Cheongju has been an important provincial town since ancient times. In the Cheongju Mountains, particularly in the area where Sangdang Sanseong is located, ruins dating from the Old Stone Age to the Bronze Age have been discovered. Settlements associated with the Paleolithic Age have also been found in Cheongju, such as the Durubong Cave Site."
    - heading: "## Geography"
      next_line: "Geum River goes through the center of Cheongju. Additionally, the tributaries of Musim and Miho flow together in the northern part of the city. To the east and west, there are the mountains of Wuam and Bumo. Musimcheon River also goes through the middle of Cheongju."
    - heading: "## Administrative districts"
      next_line: "From 1 July 2014, Cheongju and Cheongwon County unified, and administrative districts were changed to the following:"
    - heading: "## Government and infrastructure"
      next_line: "The headquarters of the Korea Disease Control and Prevention Agency, and the Ministry of Food and Drug Safety are located in the Osong Health Technology Administration Complex."
    - heading: "## Cultural properties"
      next_line: "- Sangdangsanseong (Sangdang Mountain Fortress) lies on the slopes of Mt. Uam within the city limits. The fortress is mainly a 3-to-4-metre-tall (9.8–13.1-foot) wall that stretches over 4.2 kilometres (2.6 miles) in circumference. The present walls date to the 1716 restoration of the site. Within the walls lies a small tourist village that has several restaurants. It is maintained as a historical site open to visitors."
    - heading: "## Transport"
      next_line: "Cheongju International Airport provides scheduled flights within Korea and to other parts of Asia. The main train station is located at Ogeunjang approximately 8 km (5.0 mi) north of the city hall. This station is on the Chungbuk Line. Cheongju Bus Terminal provides almost all of the bus lines to bus terminals located in other cities. Ticketing time is between 4:00 am and 11:40 pm. Cheongju Express Bus Terminal provides some bus lines for Seoul (Gangnam, Sangbong, South Seoul, East Seoul, Busan, East Deagu, Gwangju)."
    - heading: "## Education"
      next_line: "Cheongju is the site of several tertiary institutions, including:"
    - heading: "## Festival"
      next_line: "The Cheongju International Craft Biennale is usually held in September or October."
    - heading: "## Twin towns – sister cities"
      next_line: "| City | Prefecture/Province/State | Country | Year |"
    - heading: "## Notable people from Cheongju"
      next_line: "- Cho Sung-dal, footballer."
- doc_id: wiki-en-chuncheon
  sections:
    - heading: "## History"
      next_line: "People have lived in Chuncheon since the Paleolithic Age."
    - heading: "## Industry"
      next_line: "The service sector occupies a large proportion of Chuncheon's industry. As of 2015, the number of companies by industry is 4,434 in wholesale and retail, 4,890 in accommodation and restaurant, 1,609 in transportation, and 2,383 in public repair and personal service."
    - heading: "## Population"
      next_line: "Chuncheon's population has grown steadily over the past half century."
    - heading: "## Administrative divisions"
      next_line: "| Name | Korean text | Area (km2) | Population (including foreigners, 2026) |"
    - heading: "## Education"
      next_line: "In the Joseon dynasty, Chuncheon Hyanggyo was in Gyo-dong."
    - heading: "## Culture and tourism"
      next_line: "### Heritage"
    - heading: "## Sports"
      next_line: "Chuncheon Songam Sports Town began operating in 2009. It has a sports complex that accommodates 25,000 people, an 8,500-seat baseball stadium, indoor and outdoor tennis courts, a Korean archery field, an ice rink and leisure facilities."
    - heading: "## Transportation"
      next_line: "Gyeongchun Line is a double-track railway that connects Mangu station in Seoul and Chuncheon. Its stations located in Chuncheon are Baegyang-ri station, Gimyujeong station, Namchuncheon station, and Chuncheon station (terminus)."
    - heading: "## Nature"
      next_line: "Chuncheon is a basin with Obong Mountain to the north, Samak Mountain in the west, Bonghwa mountain in the southwest, and Daeryong Mountain in the southeast."
    - heading: "## Climate"
      next_line: "Chuncheon has a monsoon-influenced humid continental climate (Köppen: Dwa) with cold, dry winters and hot, rainy summers. The lowest measured temperature was −27.9 °C (−18 °F) (6 February 1969), and the highest was 39.5 °C (103 °F) (1 August 2018). The annual precipitation is an average of 1347.3 mm."
    - heading: "## Notable people"
      next_line: "- Son Heung-min: professional footballer"
    - heading: "## Sister cities"
      next_line: "| City | State | Country |"
- doc_id: wiki-en-gangneung
  sections:
    - heading: "## History"
      next_line: "Gangneung was the home of the Yemaek people in ancient times and became the land of Wiman Joseon in 129 BC. In 128 BC, Nam Ryeo, the army officer of Yaekam, punished Wujang of Wiman Korea and became the territory of the Han dynasty. In the 14th year of Goguryeo Muchheon (313), it entered Goguryeo territory."
    - heading: "## Symbols of Gangneung"
      next_line: "The flag of the city shows a red sun in the centre and blue wave in front, on a white background. The sun represents the sunrise, the wave the sea. The flower of the city is the crepe myrtle, the tree of the city is the pine tree, its bird the swan. The animal of Gangneung is the tiger."
    - heading: "## Geography"
      next_line: "Gangneung is located to the east of the Taebaek Mountains, which is the considered the 'waist' of the Korean Peninsula. To the east is Sea of Japan, and to the west are the inner side of Hongcheon County, the Pyeongchang County's Jinbu-myeon and the Daegwallyeong-myeon respectively. The southern side is connected to Donghae and the Jeongseon County's critical side. The north side is adjacent to Yangyang County Hyunbuk-myeon and Hyunnam-myeon."
    - heading: "## Administrative divisions"
      next_line: "The district includes one town (eup), seven townships (myeon), 13 neighborhoods (dong)."
    - heading: "## Nature and tourism"
      next_line: "### Beaches"
    - heading: "## Culture"
      next_line: "### Heritage"
    - heading: "## Transportation"
      next_line: "In Gangneung, Donghae Expressway connects Incheon to Gangneung and Yeongdong Expressway connects Yangyang County and Donghae. The national highway is National Route 7 (part of Asian Highway Route 6) and it connects Goseong County to Busan. It takes about 2 hours and 30 minutes to Seoul by road."
    - heading: "## Sports"
      next_line: "### Football"
    - heading: "## Sister cities"
      next_line: "- Chichibu, Saitama, Japan, since February 16, 1983"
    - heading: "## Notable people"
      next_line: "- Choi Kyu-Ha, former president of South Korea"
- doc_id: wiki-en-jeju
  sections:
    - heading: "## History"
      next_line: "The area of the city has played a central role in Jeju since before recorded history. The Samseonghyeol, holes from which the three ancestors of the Jeju people are said to have come, are located in downtown Jeju City."
    - heading: "## Transportation"
      next_line: "Jeju City is the principal transportation center for Jeju Province. It is home to the island's sole airport, Jeju International Airport. The Jeju-Seoul route is the world's busiest air route with more than 100 flights per day."
    - heading: "## Economy"
      next_line: "Due to its central position in transportation, Jeju City sees the main share of tourist traffic to the island. Many tourists arrive at the city through the port terminal or airport, stay in the tourist hotels of the Sinjeju neighborhood, and stay within the city to visit various Jeju tourist attractions. These include Dragon's Head Rock (Yongduam) along the coast; the Samseonghyeol, three holes in the downtown area; Hallasan National Park in the interior; the country's tallest mountain, Hallasan; and world's largest botanical garden, Bunjae Artpia. The 8,500-seat Jeju Baseball Stadium is near the center of the city."
    - heading: "## Geography"
      next_line: "In its former boundaries, Jeju City was 19.3 kilometers from east to west, and 10.2 kilometers from north to south. To the north, it looks across the Korea Strait at the southern coast of South Jeolla Province. To the south, it meets Seogwipo at the top of Hallasan, the island's sole mountain."
    - heading: "## Tourism"
      next_line: "The Jeju Olle Trail and Jeju Olle Walking Festival passes through the city."
    - heading: "## Demographics"
      next_line: "Historical population"
    - heading: "## Climate"
      next_line: "Jeju City has a humid subtropical climate (Köppen: Cfa) with very warm summers and cool winters. In Holdridge classification, Jeju City has a warm temperate moist forest climate. Due to its southern location, Jeju City is one of the warmest cities in Korea. However, ocean effect snow brings winter precipitation such as snow showers with strong wind during the winter. Precipitation is significant throughout the year, but is much wetter in summer, with more than 180 millimetres (7.1 in) of rain falling in each month from June to September. The highest temperature ever recorded is 37.5 °C (99.5 °F) on 25 July 1942 while the lowest temperature ever recorded is −6.0 °C (21.2 °F) on 16 February 1977."
    - heading: "## Administrative divisions"
      next_line: "Jeju is divided into 19 neighbourhoods (dong), 4 towns (eup), and 3 townships (myeon):"
    - heading: "## Twin towns – sister cities"
      next_line: "Jeju City is twinned with:"
- doc_id: wiki-en-jeonju
  sections:
    - heading: "## Geography and administrative divisions"
      next_line: "Jeonju is primarily situated in a basin surrounded by mountains such as Moryongsan to the north and Namgosan to the south, with the Jeonjucheon River flowing through the center of the city as a major ecological axis."
    - heading: "## History"
      next_line: "### Samguk (1C BC–7C AD)"
    - heading: "## Education"
      next_line: "Jeonbuk National University and Jeonju National University of Education are the public universities in Jeonju."
    - heading: "## Transportation"
      next_line: "Many city buses and taxis are available in Jeonju. However, tourists are often advised to walk between points of interest, as many attractions are near each other."
    - heading: "## Culture"
      next_line: "### Cuisine"
    - heading: "## Notable people"
      next_line: "### Celebrities"
    - heading: "## Sister cities"
      next_line: "- San Diego, California, United States"
- doc_id: wiki-ko-cheonan
  sections:
    - heading: "## 역사"
      next_line: "삼한시대 마한 54개 소국 중의 하나인 목지국이 있었다. 삼국시대에는 백제의 대목악군과 감매현·순치현이었다. 천안이라는 지명은 고려 초기에 처음 등장하였다. 고려 태조는 930년에 동서도솔을 합쳐 천안도독부를 설치하였다. 태조 왕건은 술사 예방이 삼국의 중앙에 해당하는 천안은 다섯 용이 구슬을 다투는 지세이므로 이곳에 큰 관부를 설치하면 후백제가 스스로 항복해 올 것이라는 말을 들었다. 천안은 고려의 남진정책의 전초기지로 중앙군이 파견되어 주둔하였을 것이라고 추측된다. 왕건은 왕자성에 성을 쌓고 군사훈련소를 설치하였다."
    - heading: "## 지리"
      next_line: "천안은 충청남도의 북동부에 위치하고 있다. 동쪽으로 충청북도 청주시, 진천군, 서쪽으로는 아산시, 남쪽은 공주시, 세종특별자치시와 인접하고, 북쪽은 안성천을 경계로 경기도 평택시, 안성시에 접한다. 천안시 중앙을 남북으로 가로지르는 차령산맥의 태조산(424m) 줄기를 중심으로 동서측으로 지역이 분리되어 있다. 이로 인해 동남부는 높고, 서북부는 낮은 지형이다. 북측지역은 평택평야까지 탁 트인 얕은 구릉성 평지이며, 동측은 국사봉, 만근산, 망경산 줄기를 경계로 아산시와 진천군과 인접하고 있다. 수계는 안성천, 삽교천, 금강수계로 구분되어 북부지역은 성환, 성거, 직산, 입장지역의 지표수가 북류하여 안성천으로 유출되어 서해로 유입되고, 동부지역은 성거, 진천, 전의와의 경계가 분수령이 되어 남류, 동류하여 미호강 상류를 이루어 금강으로 유입되며, 서남부지역은 직산, 목천읍계가 분수령이 되어 서류하여 곡교천으로 흘러 서해 경기만로 유입되고 있다. 표고 100m이하가 전체면적의 49.8%인 316.71㎢이고, 300m이상이 7.5%인 47.671㎢에 달하고 경사도는 중심부의 태조산, 흑성산, 동측의 만근산, 서측의 광덕산, 망경산 일대가 25˚이상의 급경사를 형성하고 있고, 그 외 지역은 대부분 15˚이내의 비교적 평탄한 지형이다. 천안은 고속도로를 기준으로 서울 남쪽으로 83.6km에 위치한 수도권의 배후도시이자 충청남도의 관문으로 성장하고 있다. 시가지를 중심으로 남북으로 경부선, 남서로는 장항선이 연결된다. 청주, 세종, 공주, 아산, 진천, 평택, 안성 방향으로 육로가 연결된다."
    - heading: "## 행정 구역"
      next_line: "천안시의 행정구역은 2구, 4읍, 8면, 19행정동이다. 천안시의 면적은 636.07 km2이고, 2018년 9월 주민등록 인구는 669,928명이다."
    - heading: "## 문화·관광"
      next_line: "### 박물관·기념관"
    - heading: "## 산업"
      next_line: "### 지역 내 총생산"
    - heading: "## 스포츠"
      next_line: "### 연고팀"
    - heading: "## 교통"
      next_line: "### 철도"
    - heading: "## 교육"
      next_line: "천안시의 유치원, 초등학교, 중학교에 관한 교육행정사무는 충청남도천안교육지원청이 담당한다."
    - heading: "## 행정기관"
      next_line: "#### 법원, 검찰청"
