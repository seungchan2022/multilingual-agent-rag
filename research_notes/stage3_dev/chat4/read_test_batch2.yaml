- doc_id: wiki-ko-chuncheon
  sections:
    - heading: "## 역사"
      next_line: "춘천 지역은 고대 부족 국가인 맥국의 수도로서 후일 고구려, 신라에 차례로 정복되었으며, 637년(선덕여왕 6년)에 우수주(牛首州)라 부르고 군주(君主)를 두었다. 673년(문무왕 13년)에 수약주(首若州)로 개칭하였고, 경덕왕 때 삭주(朔州)로, 후에 광해주(光海州)로 고쳤다. 940년(고려 태조 23년) 춘주(春州)라 칭하고 고려 성종 14년(995년), 단련사(團練使)를 두어 안변부에 예속, 신종 6년(1203) 안양도호부로 승격, 지춘주사(知春州事)로 격하되었다. 태종 13년(1413) 춘천으로 고쳐 군이 되고 1415년 도호부, 고종 24년(1887) 5번째 유수부로 춘천유수부(留守府)을 두고, 이궁(離宮)을 신축하여 위급할 때의 피난지로 지정했다."
    - heading: "## 지리"
      next_line: "춘천시는 강원특별자치도의 서북부에 있으며, 북한강 지류, 소양강 본류와의 합류점에 가까운 남안에 위치한다. 동쪽으로 인제군, 양구군, 서쪽으로 경기도 가평군, 북쪽으로 화천군, 남쪽으로 홍천군과 접한다. 춘천시 시가는 호수 가운데 발달하여 수향(水鄕) 도시를 이루며, 호반의 도시라 별칭된다. 시의 중앙부에는 춘천의 진산(鎭山)인 봉의산(鳳儀山)이 솟아 있다."
    - heading: "## 지질"
      next_line: "춘천시가 포함된 춘천 분지는 분지 내부의 화강암이 주변의 편마암보다 더 많은 침식을 받아 형성된 전형적인 차별 침식 분지이다. 춘천시 동면 월곡리에는 선캄브리아기 용두리편마암복합체 내에 한국의 유일한 연옥 광산인 춘천 옥광산이 발달한다."
    - heading: "## 행정 구역"
      next_line: "춘천시의 행정 구역은 15동 1읍 9면이다. 면적은 1,116.35 km2이고, 이 중 시내 동 면적은 52.66 km2이다. 인구는 2017년 3월 31일 기준으로 116,273세대, 282,439명이다. 성별 인구는 남성 139,427명, 여성 144,092명이다."
    - heading: "## 인구"
      next_line: "연도별 인구"
    - heading: "## 정치"
      next_line: "### 국회의원"
    - heading: "## 행정"
      next_line: "### 춘천시장"
    - heading: "## 경제"
      next_line: "### 농업"
    - heading: "## 문화·관광"
      next_line: "해마다 5월에는 소양제가 열린다. 호반의 도시라는 특성을 살리는 다양한 행사가 펼쳐지는데, 봉의산제, 민속놀이, 수상불꽃놀이, 국제레저대회, 국악경영 등이 진행된다. 봉의산제는 고려 때 몽골군의 침입을 막으려고 봉의산성에서 싸우다 전사한 선현의 넋을 달래는 추모제이다."
    - heading: "## 교통"
      next_line: "과거, 서울과 춘천 사이를 잇는 철도 노선인 경춘선이 있어 수도권에 접근하는 교통이 비교적 편리한 편이었으며, 2010년 12월 21일, 경춘선이 복선 전철화 개량사업이 완료됨과 동시에 수도권 전철 노선으로 개편되면서, 서울로의 접근성이 이전과 비교할 수 없을 정도로 개선되었다. 2012년 2월 25일에는 ITX-청춘이 경춘선에서 운행을 시작하였다. 춘천에서 출발하여 대구광역시를 거쳐 부산광역시까지 이어지는 중앙고속도로가 2001년 개통되고, 2009년, 서울특별시에서 출발하여 춘천을 거쳐 양양군으로 이어지는 서울양양고속도로가 개통되는 등, 타 지역과의 도로 연결망도 잘 갖추어진 편이다. 2016년 7월 8일 서울∼춘천~속초간 동서고속화철도 건설사업이 최종 확정되어 기존 경춘선 복선전철이 연장되어 속초까지 이어질 예정이다."
    - heading: "## 스포츠"
      next_line: "### 스포츠 팀"
    - heading: "## 교육 기관"
      next_line: "| 종합대학 | 국공립대학교 | 강원대학교 | 춘천교육대학교 | 한국방송통신대학교 강원지역대학 |"
    - heading: "## 방송 및 언론"
      next_line: "- KBS춘천방송총국"
    - heading: "## 국방"
      next_line: "대한민국 육군 2군단 본부 및 그 예하 부대가 위치한다."
    - heading: "## 자매 도시"
      next_line: "### 자매결연 도시"
- doc_id: wiki-ko-gwangju
  sections:
    - heading: "## 역사"
      next_line: "### 지명"
    - heading: "## 지리"
      next_line: "### 인문지리"
    - heading: "## 행정 구역"
      next_line: "광주광역시에는 5개 자치구(광산구, 동구, 서구, 북구, 남구)와 90개 동이 있다. 2015년 12월 31일 기준 인구는 580,427세대, 1,472,199명이다. 면적은 501.18km2이다."
    - heading: "## 인구"
      next_line: "광주는 전라도 지역의 행정과 교통의 중심지로서, 조선 시대 이래 고을과 장시(場市)가 발달하였으나 인구는 수만 명 수준에 머물렀다. 호남의 곡창지대를 배후에 두었으나, 본격적인 도시적 성장은 근대 이후에야 시작되었다."
    - heading: "## 주요 기관"
      next_line: "광주는 산지와 평야의 2개 이질 지역 접촉지대에 발달한 군사·행정상 및 교역상 좋은 위치에 자리잡고 있다. 충장로·금남로 일대가 상업의 중심지이며 ‘교육도시’라고 일컬을 정도로 대학 및 각급 학교가 많아 전남 문화의 중심지로 되어 있다. 광주에는 국립 전남대학교를 비롯하여 조선대학교·광주대학교·호남대학교·광주교육대학교 등 8개의 4년제 대학교, 조선간호대학교 등을 포함한 8개의 전문대학이 있다. 초등학교 108개교, 중학교 69개교, 고등학교 58개교 등에 38만여 명이 재학하고 있다."
    - heading: "## 경제"
      next_line: "2012년 광주광역시의 지역내총생산(GRDP)은 26조 7,700억 원이며, 실질성장률은 0.7%이다."
