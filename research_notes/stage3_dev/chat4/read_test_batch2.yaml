  sections:
    - heading: "## 역사"
      next_line: "삼한 시대에 '사로국'이라는 이름으로 비(非)한국 문헌에 처음 등장한다. 한국의 기록(아마도 신라의 왕조 실록을 기반으로 한 자료)에 따르면, 사로국은 기원전 57년 경주 지역의 여섯 개 마을이 박혁거세를 중심으로 통합되며 세워졌다고 한다. 이후 왕국이 성장하면서 국호를 신라로 변경했다. 신라 시기, 이 도시는 서라벌이라 불렸으며, 이 지명은 훗날 '서울'처럼 '수도'를 의미하는 일반 명사로 발전하게 된다. 또 계림(鷄林, 닭의 숲)'이나 금성(金城, 금의 성 또는 철의 성, 즉 난공불락의 요새)'이라는 이름도 사용되었다. 계림에 대해서는 닭·달·ᄃᆞᆯ + 벌로 재구하여 월성(月城), 양부(梁部)와 같은 단어로 보는 견해가 있으며, 닭(鷄)을 훈음차 새(鳥)로 해석하고 수풀(林)과 합쳐 새불 즉 서벌, 서라벌과 같은 의미로 보는 견해가 있다."
    - heading: "## 지리"
      next_line: "### 위치"
    - heading: "## 정치"
      next_line: "현직 경주시장은 제7회 전국동시지방선거를 통해 당선된 국민의힘 소속의 주낙영이다. 대한민국 국회에서는 경주시라는 단일 선거구로 묶여 있으며, 현직 국회의원은 대한민국 제21대 국회의원 선거에서 당선된 김석기 의원이다."
    - heading: "## 행정 구역"
      next_line: "경주시의 행정구역 면적은 1,324.41km2로, 경상북도에서 안동시에 이어 두 번째로 넓은 기초자치단체이다. 도시 지역인 시내 행정동(洞) 면적은 221.3km2이다. 행정구역은 4읍 8면 10행정동으로 구성되며, 그 아래 186법정리·동, 301행정리, 332통, 3,200반으로 나뉜다. 시청 소재지는 동천동이다."
    - heading: "## 인구"
      next_line: "신라시대 경주의 인구는 삼국유사에 의하면 \"신라의 전성기에 도읍(경주)에는 178,936호가 있었다.(新羅全盛之時 京中十七萬 八千九百三十六戶)라 하여 90만 명에서 120만 명으로 추정할 수 있다. 이에 따르면, 당대 아바스 칼리파국의 바그다드, 당나라의 장안과 함께 당시 아시아 3대 도시에 속한다고도 볼 수 있으며, 이러한 규모는 인구 25만명으로 추산되는 발해의 상경용천부의 5배 이상의 수치로 만주지역을 제외한 삼한을 통일한 신라의 국력을 상징한다."
    - heading: "## 문화"
      next_line: "### 문화유산"
    - heading: "## 관광"
      next_line: "2009년에 선덕여왕을 소재로 한 사극 드라마의 신라밀레니엄파크 촬영지로 각광을 받았다. 같은 해, 6월 8일에 천년의 꿈, 경주의 빛 타임캡슐 매설식을 가졌다. 그리고 2008년부터 제정해 6월 8일 경주시민의 날이 매년 개최하고 있다."
    - heading: "## 경제"
      next_line: "생산 취업 인구 중 농업 인구와 서비스 부문에 종사하는 인구가 많은데, 이를 농업 도시로서의 성격과 관광지로서의 지위가 높은 것을 보여 주고 있다. 경지 면적은 전체 면적의 약 19%로 적으나, 도시 근교 농업과 축산업이 발달했다. 특히 촉성 재배(참외·토마토)는 전국적으로 유명하며, 서울을 비롯하여 주요 도시에 많은 양을 공급한다."
    - heading: "## 교육"
      next_line: "조선시대부터 이 지역에는 경주향교를 비롯해 서악서원, 옥산서원도 있다. 1907년에 개교한 공립 경주보통학교가 있으며, 일제강점기에 여러 재단법인 수봉교육재단 설립의건 인가의 경주공립고등보통학교 가 세워졌다. 1979년 동국대학교 WISE캠퍼스 가 경주 역사상 최초의 대학교로 설립되었다. 1981년 1월 설립자인 김일윤이고, 학교법인 원석학원의 설립하여, 같은 해 3월 경주실업전문대학을 개교했다. 2000년대는 인구의 증가와 함께 학교의 숫자도 늘어나기 시작했으며, 2008년에 금장초등학교와 화랑중학교 등이 세워졌다. 2009년 이후 인구감소로 학생 수가 없어서 강동초등학교 왕신분교장, 전촌초등학교, 오릉초등학교, 왕신분교, 대본초등학교, 화천분교장, 양북초등학교 송전분교장, 의곡초등학교 우라분교장 등이 폐교되었다."
    - heading: "## 스포츠"
      next_line: "| 리그명 | 팀명 | 창단연도 | 홈 경기장 |"
    - heading: "## 교통"
      next_line: "### 철도 교통"
    - heading: "## 경주 8색"
      next_line: "- 화랑 적색(赤) ■"
    - heading: "## 공공 기관"
      next_line: "- 경주시청"
    - heading: "## 대형마트"
      next_line: "- 홈플러스 경주점"
    - heading: "## 영화관"
      next_line: "- 롯데시네마 경주황성"
