- doc_id: wiki-ko-suwon
  sections:
    - heading: "## 역사"
      next_line: "수원시는 선사 시대 때부터 사람이 살던 곳으로, 지동과 이의동에서 중기 구석기 시대 유물이 발견되었고, 신석기 시대, 청동기 시대, 원삼국 시대와 유적도 다수 있다. 천관우는 1979년 '마한제국(馬韓諸國)의 위치시론(位置試論)'에서 마한 모수국의 위치를 수원으로 비정하는 견해를 제시했다. 삼국 시대 백제가 차지했다가 고구려 장수왕의 남하정책으로 매홀군(買忽郡)으로 명칭이 바뀌었고, 이후 신라 경덕왕 때 '수성군'(水城郡)이라 이름을 바꾸었다. 823년 음력 2월 헌덕왕이 수성군과 당은현(唐恩縣)을 합쳤다."
    - heading: "## 지리와 지질"
      next_line: "수원시는 경기도 중남부에 있으며 동쪽은 용인시 기흥구 및 수지구에, 서쪽은 안산시 상록구와 화성시 봉담읍 및 매송면에, 남쪽은 화성시 병점 및 동탄에, 북쪽은 의왕시에 접하고 있다. 수원시의 총 면적은 121.05 km2의 주형 분지로 되어 있다."
    - heading: "## 인구통계"
      next_line: "수원시의 인구는 2023년 기준 537,078세대 1,233,431명이다. 대한민국의 기초자치단체 가운데는 가장 인구 수가 많으며 울산광역시의 2025년 3월 기준 인구 1,122,221명보다 많다. 수원은 산업화가 시작된 1970년부터 급격히 인구가 늘었으나 21세기에 들어 인구 고령화와 출산율 저하에 따른 어려움을 겪고 있다."
    - heading: "## 산업과 경제"
      next_line: "수원시의 명목 지역내총생산은 2022년 기준 약 41조 원으로 경기도 전체의 약 7 %를 차지하고 있다. 2016년 기준 지역총부가가치는 약 55조 5천억 원이다. 이 가운데 제조업이 약 10조 5천억 원으로 19 % 정도의 비중을 차지하고 사업서비스업이 16.7 % 인 9조 2천억 원이다. 반면 농업은 약 20억원 규모로 매우 미미하다. 수원은 근대 이전부터 물류 유통과 상업의 중심지였고 2016년 3조 8천억 원(7%)의 부가가치를 보였다. 이러한 산업 구조는 산업 종사자 현황에도 반영되어 2023년 기준 총 485,303 명의 산업 종사자 가운데 제조업 종사자는 38,998 명으로 8 % 를 차지하고 있다. 지역내총생산과 지역총부가가치 지표에서 보이듯 수원의 경제는 제조업을 중심으로 하고 있고 이를 바탕으로 2023년 기준 46 %의 재정자립도를 보이고 있다."
    - heading: "## 도시 구조"
      next_line: "### 주거"
    - heading: "## 행정"
      next_line: "### 행정 구역"
    - heading: "## 교육"
      next_line: "- 경기도교육청"
    - heading: "## 관광"
      next_line: "수원에는 북쪽 광교산과 서쪽 칠보산, 동쪽 청명산이 위치해 있어, 주민들의 휴식처 역할을 한다. 파장동 경수간 도로변의 지지대와 노송지대, 서쪽의 화서동 서호축만제와 서호생태수자원센터, 동쪽의 이의동 광교신도시 광교호수공원이 있다. 또한 수원시 첫 수목원인 일월수목원이 10만 1500㎡ 규모로 천천동 일월공원에 조성되어 광교산·칠보산 등에 자생하는 중요 식물유전자원을 보존하는 역할도 하게 된다."
    - heading: "## 스포츠"
      next_line: "### 축구"
    - heading: "## 교통"
      next_line: "영동고속도로와 용인서울고속도로, 평택파주고속도로가 수원시를 지나는 주요 고속도로이다. 경부고속도로가 수원시 근방인 용인시 기흥구를 지난다. 국도 제1호선, 제42호선, 제43호선, 지방도 제309호선도 수원을 통과한다."
