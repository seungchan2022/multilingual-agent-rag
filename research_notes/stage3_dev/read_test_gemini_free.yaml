      next_line: "경기도교육청"
    - heading: "## 관광"
      next_line: "수원에는 북쪽 광교산과 서쪽 칠보산, 동쪽 청명산이 위치해 있어, 주민들의 휴식처 역할을 한다. 파장동 경수간 도로변의 지지대와 노송지대, 서쪽의 화서동 서호축만제와 서호생태수자원센터, 동쪽의 이의동 광교신도시 광교호수공원이 있다. 또한 수원시 첫 수목원인 일월수목원이 10만 1500㎡ 규모로 천천동 일월공원에 조성되어 광교산·칠보산 등에 자생하는 중요 식물유전자원을 보존하는 역할도 하게 된다."
    - heading: "## 스포츠"
      next_line: "### 축구"
    - heading: "## 교통"
      next_line: "영동고속도로와 용인서울고속도로, 평택파주고속도로가 수원시를 지나는 주요 고속도로이다. 경부고속도로가 수원시 근방인 용인시 기흥구를 지난다. 국도 제1호선, 제42호선, 제43호선, 지방도 제309호선도 수원을 통과한다."
