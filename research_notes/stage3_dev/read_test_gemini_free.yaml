- doc_id: wiki-ko-cheonan
  sections:
    - heading: "## 역사"
      next_line: "삼한시대 마한 54개 소국 중의 하나인 목지국이 있었다."
    - heading: "## 지리"
      next_line: "천안은 충청남도의 북동부에 위치하고 있다. 동쪽으로 충청북도 청주시, 진천군, 서쪽으로는 아산시, 남쪽은 공주시, 세종특별자치시와 인접하고, 북쪽은 안성천을 경계로 경기도 평택시, 안성시에 접한다."
    - heading: "## 행정 구역"
      next_line: "천안시의 행정구역은 2구, 4읍, 8면, 19행정동이다. 천안시의 면적은 636.07 km2이고, 2018년 9월 주민등록 인구는 669,928명이다."
    - heading: "## 문화·관광"
      next_line: "- 독립기념관"
    - heading: "## 산업"
      next_line: "### 지역 내 총생산"
    - heading: "## 스포츠"
      next_line: "### 연고팀"
    - heading: "## 교통"
      next_line: "경부선과 장항선이 시의 서부를 지난다. 경부선은 남북으로 뻗은 형태이며, 장항선은 시의 서부를 통해 아산, 예산, 홍성으로 향하는 형태이다. 2004년 4월 1일, 천안시와 아산시의 경계지역인 아산시 배방읍 장재리에 천안아산역이 개업하였고, 2005년 1월 20일부터 경부선, 2008년 12월 15일부터 장항선에 수도권 전철 1호선이 들어오게 되어 서울로의 접근성이 향상되었다. 그리고 단국대학교, 상명대학교, 백석대학교에 위치한 두정역 인근 지역에서도 전철을 이용하면 얼마든지 수도권으로 운행이 가능하다. 하지만 수도권 전철을 이용하고 이 곳에서 내려 시내버스로 환승이 가능하다."
    - heading: "## 교육"
      next_line: "천안시의 유치원, 초등학교, 중학교에 관한 교육행정사무는 충청남도천안교육지원청이 담당한다."
    - heading: "## 행정기관"
      next_line: "#### 법원, 검찰청"
    - heading: "## 자매 도시"
      next_line: "- 대한민국 전라남도 완도군 (2007년)"
- doc_id: wiki-ko-cheongju
  sections:
    - heading: "## 역사"
      next_line: "삼한시대 마한의 땅이었다. 백제시대에 상당현(낭비성 또는 낭자곡)이라 칭해졌다. 신라 통일 후 5소경 중의 하나인 서원경으로 승격되었다."
    - heading: "## 연혁"
      next_line: "- 삼한시대 마한"
    - heading: "## 구 청주시-청원군 통합"
      next_line: "통합 시도는 1994년부터 지속적으로 있었다. 청원군 측에서는 예산이 줄고 청주시 빚만 떠안는다거나, 세금이 대폭 오른다거나, 혐오시설이 집중된다거나, 농업 브랜드 청원생명이 사라진다거나, 농촌지역 교육 혜택이 줄어든다거나 할 것이라고 우려했고, 청주시 측도 여러 가지 이유로 반대하면서 통합이 세 차례나 무산됐다. 그런 후 지자체는 주민 참여와 6·2 지방선거 과정의 공약을 토대로 양쪽 시·군민협의회가 시장·군수, 도지사와 논의를 거쳐 만든 ‘청원·청주 상생발전방안’을 통해 통합을 추진했다. 2012년 6월 청원군 주민을 대상으로 발의된 주민투표에서 전체 유권자의 36.75%가 투표에 참여하였고, 총 투표자의 79%가 시·군 통합에 찬성하여 자치단체 통합이 확정되었다. 충청북도 청주시 설치 및 지원특례에 관한 법률 제2조에 따라, 2014년 7월 1일 구 청주시와 청원군이 폐지되고 통합 청주시가 출범하였다. 통합 이후 상당구, 흥덕구, 청원구, 서원구 총 4개의 일반구를 두고 있다. 그러나 통합 직후인 2015년 시의 CI를 교체하는 내용을 담은 '청주시 상징물 등 관리 조례 일부 개정안'을 놓고 시의회에서 여야가 첨예하게 맞서거나, 청주·청원 간의 인사나 민간단체 사이에 통합 갈등이 벌어진 사례가 있고, 이후에도 2매립장 조성사업 관련 사례 등의 갈등도 존재했다."
    - heading: "## 지리"
      next_line: "### 지형"
    - heading: "## 행정 구역"
      next_line: "1946년 6월 1일 청주군 청주읍이 청주부로 승격하였고, 청주군은 청원군으로 개칭되었다. 1949년 8월 15일 청주부가 청주시로 개칭되었다."
