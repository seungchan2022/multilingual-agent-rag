- doc_id: wiki-ko-chuncheon
  sections:
    - heading: "## 역사"
      next_line: "춘천 지역은 고대 부족 국가인 맥국의 수도로서 후일 고구려, 신라에 차례로 정복되었으며, 637년(선덕여왕 6년)에 우수주(牛首州)라 부르고 군주(君主)를 두었다. 673년(문무왕 13년)에 수약주(首若州)로 개칭하였고, 경덕왕 때 삭주(朔州)로, 후에 광해주(光海州)로 고쳤다. 940년(고려 태조 23년) 춘주(春州)라 칭하고 고려 성종 14년(995년), 단련사(團練使)를 두어 안변부에 예속, 신종 6년(1203) 안양도호부로 승격, 지춘주사(知春州事)로 격하되었다. 태종 13년(1413) 춘천으로 고쳐 군이 되고 1415년 도호부, 고종 24년(1887) 5번째 유수부로 춘천유수부(留守府)을 두고, 이궁(離宮)을 신축하여 위급할 때의 피난지로 지정했다."
    - heading: "## 지리"
      next_line: "춘천시는 강원특별자치도의 서북부에 있으며, 북한강 지류, 소양강 본류와의 합류점에 가까운 남안에 위치한다. 동쪽으로 인제군, 양구군, 서쪽으로 경기도 가평군, 북쪽으로 화천군, 남쪽으로 홍천군과 접한다. 춘천시 시가는 호수 가운데 발달하여 수향(水鄕) 도시를 이루며, 호반의 도시라 별칭된다. 시의 중앙부에는 춘천의 진산(鎭山)인 봉의산(鳳儀山)이 솟아 있다."
    - heading: "## 지질"
      next_line: "춘천시가 포함된 춘천 분지는 분지 내부의 화강암이 주변의 편마암보다 더 많은 침식을 받아 형성된 전형적인 차별 침식 분지이다. 춘천시 동면 월곡리에는 선캄브리아기 용두리편마암복합체 내에 한국의 유일한 연옥 광산인 춘천 옥광산이 발달한다."
    - heading: "## 행정 구역"
      next_line: "춘천시의 행정 구역은 15동 1읍 9면이다. 면적은 1,116.35 km2이고, 이 중 시내 동 면적은 52.66 km2이다. 인구는 2017년 3월 31일 기준으로 116,273세대, 282,439명이다. 성별 인구는 남성 139,427명, 여성 144,092명이다."
    - heading: "## 인구"
      next_line: "연도별 인구"
    - heading: "## 정치"
      next_line: "### 국회의원"
    - heading: "## 행정"
      next_line: "### 춘천시장"
    - heading: "## 경제"
      next_line: "### 농업"
    - heading: "## 문화·관광"
      next_line: "해마다 5월에는 소양제가 열린다. 호반의 도시라는 특성을 살리는 다양한 행사가 펼쳐지는데, 봉의산제, 민속놀이, 수상불꽃놀이, 국제레저대회, 국악경영 등이 진행된다. 봉의산제는 고려 때 몽골군의 침입을 막으려고 봉의산성에서 싸우다 전사한 선현의 넋을 달래는 추모제이다."
    - heading: "## 교통"
      next_line: "과거, 서울과 춘천 사이를 잇는 철도 노선인 경춘선이 있어 수도권에 접근하는 교통이 비교적 편리한 편이었으며, 2010년 12월 21일, 경춘선이 복선 전철화 개량사업이 완료됨과 동시에 수도권 전철 노선으로 개편되면서, 서울로의 접근성이 이전과 비교할 수 없을 정도로 개선되었다. 2012년 2월 25일에는 ITX-청춘이 경춘선에서 운행을 시작하였다. 춘천에서 출발하여 대구광역시를 거쳐 부산광역시까지 이어지는 중앙고속도로가 2001년 개통되고, 2009년, 서울특별시에서 출발하여 춘천을 거쳐 양양군으로 이어지는 서울양양고속도로가 개통되는 등, 타 지역과의 도로 연결망도 잘 갖추어진 편이다. 2016년 7월 8일 서울∼춘천~속초간 동서고속화철도 건설사업이 최종 확정되어 기존 경춘선 복선전철이 연장되어 속초까지 이어질 예정이다."
    - heading: "## 스포츠"
      next_line: "### 스포츠 팀"
    - heading: "## 교육 기관"
      next_line: "| 종합대학 | 국공립대학교 | 강원대학교 | 춘천교육대학교 | 한국방송통신대학교 강원지역대학 |"
    - heading: "## 방송 및 언론"
      next_line: "- KBS춘천방송총국"
    - heading: "## 국방"
      next_line: "대한민국 육군 2군단 본부 및 그 예하 부대가 위치한다."
    - heading: "## 자매 도시"
      next_line: "### 자매결연 도시"
- doc_id: wiki-ko-gwangju
  sections:
    - heading: "## 역사"
      next_line: "### 지명"
    - heading: "## 지리"
      next_line: "### 인문지리"
    - heading: "## 행정 구역"
      next_line: "광주광역시에는 5개 자치구(광산구, 동구, 서구, 북구, 남구)와 90개 동이 있다. 2015년 12월 31일 기준 인구는 580,427세대, 1,472,199명이다. 면적은 501.18km2이다."
    - heading: "## 인구"
      next_line: "광주는 전라도 지역의 행정과 교통의 중심지로서, 조선 시대 이래 고을과 장시(場市)가 발달하였으나 인구는 수만 명 수준에 머물렀다. 호남의 곡창지대를 배후에 두었으나, 본격적인 도시적 성장은 근대 이후에야 시작되었다."
    - heading: "## 주요 기관"
      next_line: "광주는 산지와 평야의 2개 이질 지역 접촉지대에 발달한 군사·행정상 및 교역상 좋은 위치에 자리잡고 있다. 충장로·금남로 일대가 상업의 중심지이며 ‘교육도시’라고 일컬을 정도로 대학 및 각급 학교가 많아 전남 문화의 중심지로 되어 있다. 광주에는 국립 전남대학교를 비롯하여 조선대학교·광주대학교·호남대학교·광주교육대학교 등 8개의 4년제 대학교, 조선간호대학교 등을 포함한 8개의 전문대학이 있다. 초등학교 108개교, 중학교 69개교, 고등학교 58개교 등에 38만여 명이 재학하고 있다."
    - heading: "## 경제"
      next_line: "2012년 광주광역시의 지역내총생산(GRDP)은 26조 7,700억 원이며, 실질성장률은 0.7%이다."
    - heading: "## 문화"
      next_line: "예향, 의향, 미향의 도시 광주는 2011년 유네스코 세계기록유산 5·18 민주화운동, 2019년 유네스코 미디어아트 창의도시 재선정, 2023년 유네스코 세계지질공원 무등산권 지질공원 재인증을 통해 세계적으로 가치 있는 도시로 자리매김하고 있다. 광주 여행을 희망하는 여행객은 광주광역시에서 운영하는 '오매광주'를 통해 광주관광에 대한 다양한 정보를 얻을 수 있다."
    - heading: "## 스포츠"
      next_line: "프로 야구단인 KIA 타이거즈, K리그의 광주 FC가 광주광역시를 연고지로 한다."
    - heading: "## 교육"
      next_line: "광주 서구 화정동에 광주광역시교육청이 있고, 산하에 동부ㆍ서부 2개의 교육지원청이 있다. 광주시에는 2010년 기준 유치원 248개, 초등학교 145개교, 중학교 85개교, 고등학교 72개교가 있다. 교육청 산하에는 도서관을 비롯하여 교육연수원, 교육과학연구원, 학생교육원, 교육정보원 등이 있다."
    - heading: "## 교통"
      next_line: "광주대구고속도로, 호남고속도로가 도시의 북부, 무안광주고속도로가 도시의 중부를 관통하며 북광주 나들목, 서광산 나들목, 운수 나들목, 북광산 나들목, 광산 나들목, 동림 나들목, 산월 분기점, 서광주 나들목, 용봉 나들목, 동광주 나들목, 문흥 분기점이 도시와 연결된다. 또한 도심을 순환하는 제1순환도로와, 도심 외부를 순환하는 도로인 제2순환도로가 있으며, 이 도로는 1구간 (문흥 분기점 ~ 장원 나들목), 2구간 (장원 나들목 ~ 효덕 나들목), 3구간 (효덕 나들목 ~ 서창 나들목), 4구간 (서창 나들목 ~ 산월 분기점)로 분류되어있다. 유료 구간은 2구간 (장원 나들목 ~ 지원 나들목), 3구간(효덕 나들목 ~ 풍암 나들목), 4구간 (서창 나들목 ~ 산월 분기점)이다."
    - heading: "## 국제 교류"
      next_line: "자매도시"
- doc_id: wiki-ko-gyeongju
  sections:
    - heading: "## 역사"
      next_line: "삼한 시대에 '사로국'이라는 이름으로 비(非)한국 문헌에 처음 등장한다. 한국의 기록(아마도 신라의 왕조 실록을 기반으로 한 자료)에 따르면, 사로국은 기원전 57년 경주 지역의 여섯 개 마을이 박혁거세를 중심으로 통합되며 세워졌다고 한다. 이후 왕국이 성장하면서 국호를 신라로 변경했다. 신라 시기, 이 도시는 서라벌이라 불렸으며, 이 지명은 훗날 '서울'처럼 '수도'를 의미하는 일반 명사로 발전하게 된다. 또 계림(鷄林, 닭의 숲)'이나 금성(金城, 금의 성 또는 철의 성, 즉 난공불락의 요새)'이라는 이름도 사용되었다. 계림에 대해서는 닭·달·ᄃᆞᆯ + 벌로 재구하여 월성(月城), 양부(梁部)와 같은 단어로 보는 견해가 있으며, 닭(鷄)을 훈음차 새(鳥)로 해석하고 수풀(林)과 합쳐 새불 즉 서벌, 서라벌과 같은 의미로 보는 견해가 있다."
    - heading: "## 지리"
      next_line: "### 위치"
    - heading: "## 정치"
      next_line: "현직 경주시장은 제7회 전국동시지방선거를 통해 당선된 국민의힘 소속의 주낙영이다. 대한민국 국회에서는 경주시라는 단일 선거구로 묶여 있으며, 현직 국회의원은 대한민국 제21대 국회의원 선거에서 당선된 김석기 의원이다."
    - heading: "## 행정 구역"
      next_line: "경주시의 행정구역 면적은 1,324.41km2로, 경상북도에서 안동시에 이어 두 번째로 넓은 기초자치단체이다. 도시 지역인 시내 행정동(洞) 면적은 221.3km2이다. 행정구역은 4읍 8면 10행정동으로 구성되며, 그 아래 186법정리·동, 301행정리, 332통, 3,200반으로 나뉜다. 시청 소재지는 동천동이다."
    - heading: "## 인구"
      next_line: "신라시대 경주의 인구는 삼국유사에 의하면 \"신라의 전성기에 도읍(경주)에는 178,936호가 있었다.(新羅全盛之時 京中十七萬 八千九百三十六戶)라 하여 90만 명에서 120만 명으로 추정할 수 있다. 이에 따르면, 당대 아바스 칼리파국의 바그다드, 당나라의 장안과 함께 당시 아시아 3대 도시에 속한다고도 볼 수 있으며, 이러한 규모는 인구 25만명으로 추산되는 발해의 상경용천부의 5배 이상의 수치로 만주지역을 제외한 삼한을 통일한 신라의 국력을 상징한다."
    - heading: "## 문화"
      next_line: "### 문화유산"
    - heading: "## 관광"
      next_line: "2009년에 선덕여왕을 소재로 한 사극 드라마의 신라밀레니엄파크 촬영지로 각광을 받았다. 같은 해, 6월 8일에 천년의 꿈, 경주의 빛 타임캡슐 매설식을 가졌다. 그리고 2008년부터 제정해 6월 8일 경주시민의 날이 매년 개최하고 있다."
    - heading: "## 경제"
      next_line: "생산 취업 인구 중 농업 인구와 서비스 부문에 종사하는 인구가 많은데, 이를 농업 도시로서의 성격과 관광지로서의 지위가 높은 것을 보여 주고 있다. 경지 면적은 전체 면적의 약 19%로 적으나, 도시 근교 농업과 축산업이 발달했다. 특히 촉성 재배(참외·토마토)는 전국적으로 유명하며, 서울을 비롯하여 주요 도시에 많은 양을 공급한다."
    - heading: "## 교육"
      next_line: "조선시대부터 이 지역에는 경주향교를 비롯해 서악서원, 옥산서원도 있다. 1907년에 개교한 공립 경주보통학교가 있으며, 일제강점기에 여러 재단법인 수봉교육재단 설립의건 인가의 경주공립고등보통학교 가 세워졌다. 1979년 동국대학교 WISE캠퍼스 가 경주 역사상 최초의 대학교로 설립되었다. 1981년 1월 설립자인 김일윤이고, 학교법인 원석학원의 설립하여, 같은 해 3월 경주실업전문대학을 개교했다. 2000년대는 인구의 증가와 함께 학교의 숫자도 늘어나기 시작했으며, 2008년에 금장초등학교와 화랑중학교 등이 세워졌다. 2009년 이후 인구감소로 학생 수가 없어서 강동초등학교 왕신분교장, 전촌초등학교, 오릉초등학교, 왕신분교, 대본초등학교, 화천분교장, 양북초등학교 송전분교장, 의곡초등학교 우라분교장 등이 폐교되었다."
    - heading: "## 스포츠"
      next_line: "| 리그명 | 팀명 | 창단연도 | 홈 경기장 |"
    - heading: "## 교통"
      next_line: "### 철도 교통"
    - heading: "## 경주 8색"
      next_line: "- 화랑 적색(赤) ■"
