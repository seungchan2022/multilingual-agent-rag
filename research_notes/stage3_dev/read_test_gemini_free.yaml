- doc_id: wiki-ko-jeonju
  sections:
    - heading: "## 역사"
      next_line: "### 지명 유래"
    - heading: "## 지리"
      next_line: "### 지형"
    - heading: "## 행정 구역"
      next_line: "전주시의 행정 구역은 2구 35행정동 82법정동으로 구성되어 있다. 면적은 205.5 km2이고, 인구는 2019년 12월 말 주민등록 기준으로 65만1091 명, 26만6541 가구이다."
    - heading: "## 정치"
      next_line: "전주시는 갑·을·병 선거구 등 총 3개의 선거구가 있다. 16대 국회까지는 2개 선거구였으나, 2004년에 완산구 선거구가 완산구 갑·을 선거구로 분리되어 3개 선거구가 되었다."
    - heading: "## 인구"
      next_line: "인구 변화"
    - heading: "## 관광"
      next_line: "- 풍남문"
    - heading: "## 문화"
      next_line: "### 박물관"
    - heading: "## 경제"
      next_line: "### 전주시 주요기업"
    - heading: "## 교통"
      next_line: "국도 17호, 21호, 26호선 등이 시내를 통과하며, 1번 국도, 27번 국도는 시내를 우회한다. 여의동2가에 있는 전주 나들목이나 완주군 이서면에 있는 서전주 나들목에서 호남고속도로에, 완주군 용진읍의 완주 나들목이나 소양면의 소양 나들목에서 새만금포항고속도로지선에, 금상동에 있는 동전주 나들목과 완주군 상관면에 있는 상관 나들목에서 순천완주고속도로에 진입할 수 있다."
    - heading: "## 교육"
      next_line: "전주시 일반고등학교는 고등학교 평준화 정책을 시행하고 있으며, 매년 12월 중학교 졸업예정자/졸업자 및 고등학교 입학자격 획득자에 대해 내신성적으로 선발한다. 특성화 고등학교 및 기타 고등학교는 학교장의 추천을 통해 내신성적으로 입학인원을 선발한다."
    - heading: "## 스포츠"
      next_line: "프로축구 K리그1 소속인 전북 현대 모터스가 전주월드컵경기장을 홈구장으로 삼고 있으며, K4리그 소속인 전북 현대 모터스 B와 전주시민축구단이 각각 전주월드컵경기장 보조구장과 전주종합경기장을 홈구장으로 삼고 있다."
    - heading: "## 국제 교류"
      next_line: "### 자매 도시"
- doc_id: wiki-ko-sejong
  sections:
    - heading: "## 역사"
      next_line: "### 세종특별자치시 출범 이전"
    - heading: "## 행정 구역"
      next_line: "세종특별자치시는 하위 행정구역으로 시·군·구의 기초지방자치단체를 두지 않는 단층제 광역지방자치단체로 시의 행정구역은 1읍 9면 14행정동 18법정동 122리로 구성되어 있다."
    - heading: "## 사법·행정 기관"
      next_line: "2012년 7월 1일 출범 당시 인구는 100,700여 명이었고, 광역지방자치단체의 지위로 출범한 세종특별자치시의 성격으로 인하여 세종특별자치시교육청도 함께 출범하였다. 대전지방법원, 대전지방검찰청 직속 관할 지역으로 그대로 유지하되, 대전지방법원 산하 연기군법원은 세종시법원으로 명칭이 변경되었으며, 충남지방경찰청 소속 연기경찰서는 세종경찰서로 개칭되었다. 2019년 6월 25일 세종지방경찰청이 설치되었다. 2021년 1월 1일 세종별자치시지방경찰청이 세종특별자치시경찰청으로 개칭했다. 2021년 10월 4일 세종남부경찰서가 개청하여 기존 세종경찰서는 세종북부경찰서로 명칭이 변경되었다."
    - heading: "## 인구"
      next_line: "세종특별자치시는 2012년 7월 1일 공식 출범한 대한민국의 행정중심복합도시로서, 충청남도 연기군 전역과 공주시, 청원군, 대전광역시 일부 지역을 편입하여 설치되었다. 출범 이후 세종시는 정부 부처 및 공공기관의 이전과 함께 인구가 급격히 증가하며 새로운 도시로서의 기반을 마련하였다."
    - heading: "## 이전 기관"
      next_line: "### 중앙행정기관"
    - heading: "## 교통"
      next_line: "### 교통 체계"
    - heading: "## 기반시설"
      next_line: "대전광역시에서 행정중심복합도시까지 12.7km의 물길공사를 완료하고 상수관로를 연결하여, 안정적인 수돗물 공급이 이루어지고 있다. 세종시는 1일 6만 톤의 대전광역시 수돗물을 공급받게 된다."
    - heading: "## 문화"
      next_line: "### 국보"
    - heading: "## 교육 기관"
      next_line: "- 사립대학교"
    - heading: "## 사건·사고 및 논란"
      next_line: "### 충청남도 세종시안과 정부 직할 세종특별자치시안 대립"
- doc_id: wiki-ko-suwon
  sections:
    - heading: "## 역사"
      next_line: "수원시는 선사 시대 때부터 사람이 살던 곳으로, 지동과 이의동에서 중기 구석기 시대 유물이 발견되었고, 신석기 시대, 청동기 시대, 원삼국 시대와 유적도 다수 있다. 천관우는 1979년 '마한제국(馬韓諸國)의 위치시론(位置試論)'에서 마한 모수국의 위치를 수원으로 비정하는 견해를 제시했다. 삼국 시대 백제가 차지했다가 고구려 장수왕의 남상정책으로 매홀군(買忽郡)으로 명칭이 바뀌었고, 이후 신라 경덕왕 때 '수성군'(水城郡)이라 이름을 바꾸었다. 823년 음력 2월 헌덕왕이 수성군과 당은현(唐恩縣)을 합쳤다."
    - heading: "## 지리와 지질"
      next_line: "수원시는 경기도 중남부에 있으며 동쪽은 용인시 기흥구 및 수지구에, 서쪽은 안산시 상록구와 화성시 봉담읍 및 매송면에, 남쪽은 화성시 병점 및 동탄에, 북쪽은 의왕시에 접하고 있다. 수원시의 총 면적은 121.05 km2의 주형 분지로 되어 있다."
    - heading: "## 인구통계"
      next_line: "수원시의 인구는 2023년 기준 537,078세대 1,233,431명이다. 대한민국의 기초자치단체 가운데는 가장 인구 수가 많으며 울산광역시의 2025년 3월 기준 인구 1,122,221명보다 많다. 수원은 산업화가 시작된 1970년부터 급격히 인구가 늘았으나 21세기에 들어 인구 고령화와 출산율 저하에 따른 어려움을 겪고 있다."
    - heading: "## 산업과 경제"
      next_line: "수원시의 명목 지역내총생산은 2022년 기준 약 41조 원으로 경기도 전체의 약 7 %를 차지하고 있다. 2016년 기준 지역총부가가치는 약 55조 5천억 원이다. 이 가운데 제조업이 약 10조 5천억 원으로 19 % 정도의 비중을 차지하고 사업서비스업이 16.7 % 인 9조 2천억 원이다. 반면 농업은 약 20억원 규모로 매우 미미하다. 수원은 근대 이전부터 물류 유통과 상업의 중심지였고 2016년 3조 8천억 원(7%)의 부가가치를 보였다. 이러한 산업 구조는 산업 종사자 현황에도 반영되어 2023년 기준 총 485,303 명의 산업 종사자 가운데 제조업 종사자는 38,998 명으로 8 % 를 차지하고 있다. 지역내총생산과 지역총부가가치 지표에서 보이듯 수원의 경제는 제조업을 중심으로 하고 있고 이를 바탕으로 2023년 기준 46 %의 재정자립도를 보이고 있다."
