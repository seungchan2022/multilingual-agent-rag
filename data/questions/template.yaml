# 평가 질문의 빈 양식. 칸의 뜻과 규칙은 EVALUATION.md ③에 있다.
# 개발용과 최종 평가용은 같은 형식이고 파일만 다르다. 최종 평가용 파일은 프로젝트 폴더 밖에 둔다.
# 이 파일의 두 항목은 칸을 보여 주는 빈 양식이고 실제 질문이 아니다.

# 답 있는 질문
- id: ""                    # 질문의 이름. 개발용은 dev-001, 최종 평가용은 final-001처럼 적는다
  question: ""              # 질문 문장
  question_language: ""     # ko 또는 en
  evidence_language: ""     # ko 또는 en. 이 질문의 모든 근거 구절이 있는 문서의 언어
  type: ""                  # single_fact, table_numeric, multi_doc, paraphrase 중 하나
  answer: ""                # 정답 문장
  required_facts:           # 답을 내는 데 꼭 필요한 사실. 문서에 있는 사실과 그 사실들에서 나오는 결론
    - fact: ""              # 사실 하나
      in_answer: true       # 이 사실이 정답에 들어가면 true(정답 채점에 쓴다), 답을 내는 데만 필요하면 false. 결론 사실은 true
      evidence:             # 이 사실의 근거 구절. 여러 개이면 어느 것이든 근거가 된다. 다른 사실들에서 나오는 결론이면 []
        - doc_id: ""        # 2단계 문서 목록의 식별자
          location: ""      # 문서 안의 위치 (절 제목 등)
          passage: ""       # 원문 구절. 글자 그대로 적는다

# 답 없는 질문
- id: ""
  question: ""
  question_language: ""     # ko 또는 en
  evidence_language: null   # 근거 문서가 없다
  type: no_answer
  answer: null              # 정답이 없다
  required_facts: []        # 근거 없음 표시
  expected_refusal: ""      # 기대하는 거절 방식. 예: 그런 선수는 없다고 답한다
  no_answer_reason: ""      # 코퍼스에서 찾아본 범위와, 일반 지식으로도 답할 수 없다고 본 이유
  rebuttal: []              # 전제를 반박하는 구절. 코퍼스에 있으면 doc_id, location, passage를 적고 없으면 []
