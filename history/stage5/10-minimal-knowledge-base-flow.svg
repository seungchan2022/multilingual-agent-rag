<svg viewBox="0 0 480 1102" role="img" aria-labelledby="stage5-10-flow-title stage5-10-flow-desc" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="stage5-10-flow-title">최소판 지식 베이스를 만든 순서</title>
  <desc id="stage5-10-flow-desc">5단계를 두 이슈로 나누고, PostgreSQL 18을 설치하고, 원본에서 코퍼스를 다시 만들 수 있는지 확인한 뒤 청크 프로그램을 만들었다. 표 청크 확인에서 찾은 들뜬 상태 행의 한계를 규칙으로 고치고, 벡터를 넣고, 채점 프로그램을 결과보다 먼저 커밋한 뒤 검색 비교로 조합 하나를 골랐다. 닫는 절차에서 어드바이저 점검과 Codex 검토 두 번을 거쳐 닫았다.</desc>
  <defs><marker id="s510-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4558"/></marker></defs>
  <g stroke="#3b4558" stroke-width="1.2" marker-end="url(#s510-arrow)"><line x1="240" y1="72" x2="240" y2="92"/><line x1="240" y1="150" x2="240" y2="170"/><line x1="240" y1="228" x2="240" y2="248"/><line x1="240" y1="306" x2="240" y2="326"/><line x1="240" y1="384" x2="240" y2="404"/><line x1="240" y1="462" x2="240" y2="482"/><line x1="240" y1="540" x2="240" y2="560"/><line x1="240" y1="618" x2="240" y2="638"/><line x1="240" y1="696" x2="240" y2="716"/><line x1="240" y1="774" x2="240" y2="794"/><line x1="240" y1="852" x2="240" y2="872"/><line x1="240" y1="930" x2="240" y2="950"/><line x1="240" y1="1008" x2="240" y2="1028"/></g>
  <g><rect x="32" y="16" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">01</text><text x="76" y="40" font-size="16" font-weight="700" fill="#1f2230">항목 1: 5단계를 두 이슈로 나눔</text><circle cx="80" cy="56" r="2" fill="#59627a"/><text x="92" y="60" font-size="12" fill="#3b4558">최소판 몫과 청크 통계만 이번에</text></g>
  <g><rect x="32" y="94" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">02</text><text x="76" y="118" font-size="16" font-weight="700" fill="#1f2230">항목 2: 설치와 PostgreSQL 18</text><circle cx="80" cy="134" r="2" fill="#59627a"/><text x="92" y="138" font-size="12" fill="#3b4558">pgvector가 17·18용만 있어 18로</text></g>
  <g><rect x="32" y="172" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">03</text><text x="76" y="196" font-size="16" font-weight="700" fill="#1f2230">항목 3: 원본에서 코퍼스 다시 만들기 확인</text><circle cx="80" cy="212" r="2" fill="#59627a"/><text x="92" y="216" font-size="12" fill="#3b4558">마크다운 20개, 근거 줄 64개 같음</text></g>
  <g><rect x="32" y="250" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">04</text><text x="76" y="274" font-size="16" font-weight="700" fill="#1f2230">항목 4: 청크 프로그램과 규칙의 빈 곳</text><circle cx="80" cy="290" r="2" fill="#59627a"/><text x="92" y="294" font-size="12" fill="#3b4558">줄 목록, 표 이름 줄, 묶음 공유</text></g>
  <g><rect x="32" y="328" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">05</text><text x="76" y="352" font-size="16" font-weight="700" fill="#1f2230">항목 5: 표 청크 확인</text><circle cx="80" cy="368" r="2" fill="#59627a"/><text x="92" y="372" font-size="12" fill="#3b4558">틀린 청크 0, 들뜬 상태 행의 한계</text></g>
  <g><rect x="32" y="406" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="430" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">06</text><text x="76" y="430" font-size="16" font-weight="700" fill="#1f2230">들뜬 상태 행 규칙을 더하고 다시 확인</text><circle cx="80" cy="446" r="2" fill="#59627a"/><text x="92" y="450" font-size="12" fill="#3b4558">값에 이름, 둘째 머리글 줄 뺌</text></g>
  <g><rect x="32" y="484" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="508" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">07</text><text x="76" y="508" font-size="16" font-weight="700" fill="#1f2230">항목 6: 벡터를 PostgreSQL에 넣기</text><circle cx="80" cy="524" r="2" fill="#59627a"/><text x="92" y="528" font-size="12" fill="#3b4558">조합 8개, 다시 넣어도 같은 벡터</text></g>
  <g><rect x="32" y="562" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="586" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">08</text><text x="76" y="586" font-size="16" font-weight="700" fill="#1f2230">항목 7: 채점 프로그램을 결과 전에 커밋</text><circle cx="80" cy="602" r="2" fill="#59627a"/><text x="92" y="606" font-size="12" fill="#3b4558">기준을 결과보다 먼저 고정</text></g>
  <g><rect x="32" y="640" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="664" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">09</text><text x="76" y="664" font-size="16" font-weight="700" fill="#1f2230">항목 8, 9: 검색 비교와 청크 통계</text><circle cx="80" cy="680" r="2" fill="#59627a"/><text x="92" y="684" font-size="12" fill="#3b4558">128 + 제목 + bge-m3, 31/38</text></g>
  <g><rect x="32" y="718" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="742" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">10</text><text x="76" y="742" font-size="16" font-weight="700" fill="#1f2230">닫는 절차: 완료 기준 대조, 어드바이저</text><circle cx="80" cy="758" r="2" fill="#59627a"/><text x="92" y="762" font-size="12" fill="#3b4558">표 질문 해석을 모델 차이로 고침</text></g>
  <g><rect x="32" y="796" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="820" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">11</text><text x="76" y="820" font-size="16" font-weight="700" fill="#1f2230">Codex 1차</text><circle cx="80" cy="836" r="2" fill="#59627a"/><text x="92" y="840" font-size="12" fill="#3b4558">보통 1, 낮음 1</text></g>
  <g><rect x="32" y="874" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="898" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">12</text><text x="76" y="898" font-size="16" font-weight="700" fill="#1f2230">기록 칸을 더해 다시 돌림</text><circle cx="80" cy="914" r="2" fill="#59627a"/><text x="92" y="918" font-size="12" fill="#3b4558">판정 칸 304줄 모두 같음</text></g>
  <g><rect x="32" y="952" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="976" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">13</text><text x="76" y="976" font-size="16" font-weight="700" fill="#1f2230">Codex 2차</text><circle cx="80" cy="992" r="2" fill="#59627a"/><text x="92" y="996" font-size="12" fill="#3b4558">2개 해소, 새 지적 없음</text></g>
  <g><rect x="32" y="1030" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="1054" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">14</text><text x="76" y="1054" font-size="16" font-weight="700" fill="#1f2230">닫음</text><circle cx="80" cy="1070" r="2" fill="#59627a"/><text x="92" y="1074" font-size="12" fill="#3b4558">6단계 Baseline과 첫 비교로</text></g>
</svg>
