<svg viewBox="0 0 480 868" role="img" aria-labelledby="stage2-flow-title stage2-flow-desc" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="stage2-flow-title">2단계가 진행된 순서</title>
  <desc id="stage2-flow-desc">분야를 한국의 도시로 정하고 문서 28개를 골라 받은 뒤 마크다운으로 바꾸고, 사실을 다시 세고, 다시 만들 수 있는 조건과 표의 모양을 정하고, 지시서에 문서 목록을 넣었다. 완료 기준 대조와 Codex 검토 두 번을 거쳐 닫았다.</desc>
  <defs><marker id="s2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4558"/></marker></defs>
  <g stroke="#3b4558" stroke-width="1.2" marker-end="url(#s2-arrow)"><line x1="240" y1="72" x2="240" y2="92"/><line x1="240" y1="150" x2="240" y2="170"/><line x1="240" y1="228" x2="240" y2="248"/><line x1="240" y1="306" x2="240" y2="326"/><line x1="240" y1="384" x2="240" y2="404"/><line x1="240" y1="462" x2="240" y2="482"/><line x1="240" y1="540" x2="240" y2="560"/><line x1="240" y1="618" x2="240" y2="638"/><line x1="240" y1="696" x2="240" y2="716"/><line x1="240" y1="774" x2="240" y2="794"/></g>
  <g><rect x="32" y="16" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">01</text><text x="76" y="40" font-size="16" font-weight="700" fill="#1f2230">항목 1: 분야를 한국의 도시로</text><circle cx="80" cy="56" r="2" fill="#59627a"/><text x="92" y="60" font-size="12" fill="#3b4558">32개 분야를 같은 기준으로 재서 골랐다</text></g>
  <g><rect x="32" y="94" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">02</text><text x="76" y="118" font-size="16" font-weight="700" fill="#1f2230">항목 2: 도시 12곳과 문서 28개</text><circle cx="80" cy="134" r="2" fill="#59627a"/><text x="92" y="138" font-size="12" fill="#3b4558">두 언어 4곳, 영어 4곳, 한국어 4곳</text></g>
  <g><rect x="32" y="172" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">03</text><text x="76" y="196" font-size="16" font-weight="700" fill="#1f2230">항목 3: 원문을 받아 마크다운으로</text><circle cx="80" cy="212" r="2" fill="#59627a"/><text x="92" y="216" font-size="12" fill="#3b4558">정보 상자와 표를 남겼다</text></g>
  <g><rect x="32" y="250" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">04</text><text x="76" y="274" font-size="16" font-weight="700" fill="#1f2230">항목 3-2: 마크다운으로 사실을 다시 셈</text><circle cx="80" cy="290" r="2" fill="#59627a"/><text x="92" y="294" font-size="12" fill="#3b4558">필요한 수를 넘었다</text></g>
  <g><rect x="32" y="328" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">05</text><text x="76" y="352" font-size="16" font-weight="700" fill="#1f2230">항목 4: 다시 만들 수 있는 조건</text><circle cx="80" cy="368" r="2" fill="#59627a"/><text x="92" y="372" font-size="12" fill="#3b4558">원본 고정, 커밋 직전 검사</text></g>
  <g><rect x="32" y="406" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="430" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">06</text><text x="76" y="430" font-size="16" font-weight="700" fill="#1f2230">항목 5: 표 100개의 모양</text><circle cx="80" cy="446" r="2" fill="#59627a"/><text x="92" y="450" font-size="12" fill="#3b4558">4단계에서 따로 볼 모양을 셌다</text></g>
  <g><rect x="32" y="484" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="508" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">07</text><text x="76" y="508" font-size="16" font-weight="700" fill="#1f2230">항목 6: 지시서에 문서 목록</text><circle cx="80" cy="524" r="2" fill="#59627a"/><text x="92" y="528" font-size="12" fill="#3b4558">두 영어 소개 글의 제한</text></g>
  <g><rect x="32" y="562" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="584" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">닫는 절차: 완료 기준 대조</text><text x="240" y="606" font-size="12" fill="#3b4558" text-anchor="middle">사용자 확인 기록이 빠진 것을 찾았다</text></g>
  <g><rect x="32" y="640" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="662" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">Codex 1차: 지적 6개, 항목 7 확인</text><text x="240" y="684" font-size="12" fill="#3b4558" text-anchor="middle">표의 글자, 질문에 쓰지 않는 사실</text></g>
  <g><rect x="32" y="718" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="740" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">Codex 2차: 지적 3개</text><text x="240" y="762" font-size="12" fill="#3b4558" text-anchor="middle">반올림한 값도 다른 값으로 본다</text></g>
  <g><rect x="32" y="796" width="416" height="40" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="822" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">닫음</text></g>
</svg>
