<svg viewBox="0 0 480 1258" role="img" aria-labelledby="stage2-6-flow-title stage2-6-flow-desc" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="stage2-6-flow-title">도메인 다시 고르기가 진행된 순서</title>
  <desc id="stage2-6-flow-desc">STEM 후보 셋을 실험으로 재고, 재료 값으로 다시 세고, 짧은 시험으로 새 분야를 걸러 정식 실험을 했다. 위성으로 정했다가 Codex 1차 지적으로 무르고, 새 후보와 코퍼스 단위 검사를 거쳐 길 1로 코퍼스를 꾸리는 방법을 다시 정해 희토류 원소를 골랐다. 10-25까지의 범위를 정하고 닫는 절차를 거쳤다.</desc>
  <defs><marker id="s26-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4558"/></marker></defs>
  <g stroke="#3b4558" stroke-width="1.2" marker-end="url(#s26-arrow)"><line x1="240" y1="72" x2="240" y2="92"/><line x1="240" y1="150" x2="240" y2="170"/><line x1="240" y1="228" x2="240" y2="248"/><line x1="240" y1="306" x2="240" y2="326"/><line x1="240" y1="384" x2="240" y2="404"/><line x1="240" y1="462" x2="240" y2="482"/><line x1="240" y1="540" x2="240" y2="560"/><line x1="240" y1="618" x2="240" y2="638"/><line x1="240" y1="696" x2="240" y2="716"/><line x1="240" y1="774" x2="240" y2="794"/><line x1="240" y1="852" x2="240" y2="872"/><line x1="240" y1="930" x2="240" y2="950"/><line x1="240" y1="1008" x2="240" y2="1028"/><line x1="240" y1="1086" x2="240" y2="1106"/><line x1="240" y1="1164" x2="240" y2="1184"/></g>
  <g><rect x="32" y="16" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">01</text><text x="76" y="40" font-size="16" font-weight="700" fill="#1f2230">항목 1~9: 후보 셋과 기준과 질문 규칙</text><circle cx="80" cy="56" r="2" fill="#59627a"/><text x="92" y="60" font-size="12" fill="#3b4558">화학 원소·태양계 천체·광물, 값 + 계산 질문</text></g>
  <g><rect x="32" y="94" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">02</text><text x="76" y="118" font-size="16" font-weight="700" fill="#1f2230">항목 11: 첫 번째 재기, 세 후보 탈락</text><circle cx="80" cy="134" r="2" fill="#59627a"/><text x="92" y="138" font-size="12" fill="#3b4558">세 후보 모두 기준 3에서 떨어졌다</text></g>
  <g><rect x="32" y="172" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">03</text><text x="76" y="196" font-size="16" font-weight="700" fill="#1f2230">항목 12, 13, 19: 재료 값으로 다시 셈</text><circle cx="80" cy="212" r="2" fill="#59627a"/><text x="92" y="216" font-size="12" fill="#3b4558">다시 세도 기준 1에서 떨어졌다</text></g>
  <g><rect x="32" y="250" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">04</text><text x="76" y="274" font-size="16" font-weight="700" fill="#1f2230">항목 14~18: 짧은 시험으로 새 분야 거르기</text><circle cx="80" cy="290" r="2" fill="#59627a"/><text x="92" y="294" font-size="12" fill="#3b4558">다섯 분야 가운데 셋을 정식 실험으로</text></g>
  <g><rect x="32" y="328" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">05</text><text x="76" y="352" font-size="16" font-weight="700" fill="#1f2230">항목 20: 정식 실험, 기준 2를 뺌, 문서 측정</text><circle cx="80" cy="368" r="2" fill="#59627a"/><text x="92" y="372" font-size="12" fill="#3b4558">세 분야가 기준 1·3·4를 넘었다</text></g>
  <g><rect x="32" y="406" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="430" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">06</text><text x="76" y="430" font-size="16" font-weight="700" fill="#1f2230">항목 23, 25, 10: 위성, 다시 할 것, 기한</text><circle cx="80" cy="446" r="2" fill="#59627a"/><text x="92" y="450" font-size="12" fill="#3b4558">기한을 10-25로, 최소판부터</text></g>
  <g><rect x="32" y="484" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="506" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">Codex 1차: 지적 3개, 위성을 무름</text><text x="240" y="528" font-size="12" fill="#3b4558" text-anchor="middle">단위까지 보고 다시 세니 위성 A 재료 값 19</text></g>
  <g><rect x="32" y="562" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="586" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">07</text><text x="76" y="586" font-size="16" font-weight="700" fill="#1f2230">항목 21: 새 후보 여섯, 코퍼스 단위 검사</text><circle cx="80" cy="602" r="2" fill="#59627a"/><text x="92" y="606" font-size="12" fill="#3b4558">모두 한국어 쪽에서 떨어졌다</text></g>
  <g><rect x="32" y="640" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="664" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">08</text><text x="76" y="664" font-size="16" font-weight="700" fill="#1f2230">항목 21: 심층 리서치, 길 1</text><circle cx="80" cy="680" r="2" fill="#59627a"/><text x="92" y="684" font-size="12" fill="#3b4558">코퍼스를 꾸리는 방법을 문서를 보고 다시 정함</text></g>
  <g><rect x="32" y="718" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="742" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">09</text><text x="76" y="742" font-size="16" font-weight="700" fill="#1f2230">항목 21: 규칙 정하기, 세는 규칙 고치기</text><circle cx="80" cy="758" r="2" fill="#59627a"/><text x="92" y="762" font-size="12" fill="#3b4558">갈래 4·3·3, 세는 규칙을 근본적으로 고침</text></g>
  <g><rect x="32" y="796" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="820" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">10</text><text x="76" y="820" font-size="16" font-weight="700" fill="#1f2230">항목 21: 3 세기, 모델 시험</text><circle cx="80" cy="836" r="2" fill="#59627a"/><text x="92" y="840" font-size="12" fill="#3b4558">두 분야 모두 넘었다</text></g>
  <g><rect x="32" y="874" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="898" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">11</text><text x="76" y="898" font-size="16" font-weight="700" fill="#1f2230">항목 22, 23: 희토류 원소</text><circle cx="80" cy="914" r="2" fill="#59627a"/><text x="92" y="918" font-size="12" fill="#3b4558">여유 희토류 원소 6.000, 외계 행성 2.786</text></g>
  <g><rect x="32" y="952" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="976" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">12</text><text x="76" y="976" font-size="16" font-weight="700" fill="#1f2230">항목 24: 10-25까지의 범위</text><circle cx="80" cy="992" r="2" fill="#59627a"/><text x="92" y="996" font-size="12" fill="#3b4558">개발용 질문은 2단계 뒤 최소판과 나란히</text></g>
  <g><rect x="32" y="1030" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="1052" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">닫는 절차: 완료 기준 대조, 어드바이저</text><text x="240" y="1074" font-size="12" fill="#3b4558" text-anchor="middle">2단계에 남은 일 세 가지를 바로잡았다</text></g>
  <g><rect x="32" y="1108" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="1130" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">Codex 2차</text><text x="240" y="1152" font-size="12" fill="#3b4558" text-anchor="middle">1차 지적 셋 해소, 새 지적 하나를 바로 고침</text></g>
  <g><rect x="32" y="1186" width="416" height="40" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="1212" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">닫음</text></g>
</svg>
