<svg viewBox="0 0 480 1258" role="img" aria-labelledby="stage2-7-flow-title stage2-7-flow-desc" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="stage2-7-flow-title">희토류 원소 코퍼스를 만든 순서</title>
  <desc id="stage2-7-flow-desc">문서 20개의 목록을 적고 원문을 받아 마크다운으로 바꾼 뒤, 사용자 확인으로 변환 규칙을 고치고 표 모양을 다시 셌다. 값 목록을 만들어 모든 값을 견주고 부딪히는 값 목록을 만든 뒤, 3 세기의 한쪽 언어 사실이 충분한지 다시 세고 질문 재료를 확인했다. 두 번째 소스는 찾지 않기로 하고 닫는 절차와 Codex 검토 두 번을 거쳤다.</desc>
  <defs><marker id="s27-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4558"/></marker></defs>
  <g stroke="#3b4558" stroke-width="1.2" marker-end="url(#s27-arrow)"><line x1="240" y1="72" x2="240" y2="92"/><line x1="240" y1="150" x2="240" y2="170"/><line x1="240" y1="228" x2="240" y2="248"/><line x1="240" y1="306" x2="240" y2="326"/><line x1="240" y1="384" x2="240" y2="404"/><line x1="240" y1="462" x2="240" y2="482"/><line x1="240" y1="540" x2="240" y2="560"/><line x1="240" y1="618" x2="240" y2="638"/><line x1="240" y1="696" x2="240" y2="716"/><line x1="240" y1="774" x2="240" y2="794"/><line x1="240" y1="852" x2="240" y2="872"/><line x1="240" y1="930" x2="240" y2="950"/><line x1="240" y1="1008" x2="240" y2="1028"/><line x1="240" y1="1086" x2="240" y2="1106"/><line x1="240" y1="1164" x2="240" y2="1184"/></g>
  <g><rect x="32" y="16" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">01</text><text x="76" y="40" font-size="16" font-weight="700" fill="#1f2230">항목 1, 2: 문서 20개의 목록</text><circle cx="80" cy="56" r="2" fill="#59627a"/><text x="92" y="60" font-size="12" fill="#3b4558">문서마다 주제 하나와 갈래</text></g>
  <g><rect x="32" y="94" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">02</text><text x="76" y="118" font-size="16" font-weight="700" fill="#1f2230">항목 6: 원문 받기와 변환</text><circle cx="80" cy="134" r="2" fill="#59627a"/><text x="92" y="138" font-size="12" fill="#3b4558">20개를 받아 마크다운으로</text></g>
  <g><rect x="32" y="172" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">03</text><text x="76" y="196" font-size="16" font-weight="700" fill="#1f2230">항목 7: 사용자 확인</text><circle cx="80" cy="212" r="2" fill="#59627a"/><text x="92" y="216" font-size="12" fill="#3b4558">지적을 변환 규칙으로 고침</text></g>
  <g><rect x="32" y="250" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">04</text><text x="76" y="274" font-size="16" font-weight="700" fill="#1f2230">항목 8, 9: 도시 때 도구는 쓸 때 새로</text><circle cx="80" cy="290" r="2" fill="#59627a"/><text x="92" y="294" font-size="12" fill="#3b4558">질문 프로그램 시험은 3단계 전에 고친다</text></g>
  <g><rect x="32" y="328" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">05</text><text x="76" y="352" font-size="16" font-weight="700" fill="#1f2230">항목 8: 변환 검사 다시 씀</text><circle cx="80" cy="368" r="2" fill="#59627a"/><text x="92" y="372" font-size="12" fill="#3b4558">희토류 원소 기준 12개 항목</text></g>
  <g><rect x="32" y="406" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="430" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">06</text><text x="76" y="430" font-size="16" font-weight="700" fill="#1f2230">항목 10: 표 모양 다시 셈</text><circle cx="80" cy="446" r="2" fill="#59627a"/><text x="92" y="450" font-size="12" fill="#3b4558">값 칸 줄바꿈과 화학식 규칙</text></g>
  <g><rect x="32" y="484" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="508" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">07</text><text x="76" y="508" font-size="16" font-weight="700" fill="#1f2230">항목 11: 값 목록의 쓰임과 기준</text><circle cx="80" cy="524" r="2" fill="#59627a"/><text x="92" y="528" font-size="12" fill="#3b4558">수가 같을 때만 같은 값, 모든 칸과 본문 숫자</text></g>
  <g><rect x="32" y="562" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="586" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">08</text><text x="76" y="586" font-size="16" font-weight="700" fill="#1f2230">항목 11: 값 목록 만들고 견주기</text><circle cx="80" cy="602" r="2" fill="#59627a"/><text x="92" y="606" font-size="12" fill="#3b4558">읽어야 할 묶음은 AI가 판정</text></g>
  <g><rect x="32" y="640" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="664" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">09</text><text x="76" y="664" font-size="16" font-weight="700" fill="#1f2230">항목 11: 부딪히는 값 목록</text><circle cx="80" cy="680" r="2" fill="#59627a"/><text x="92" y="684" font-size="12" fill="#3b4558">209개, Codex 1차 반영 뒤 213개</text></g>
  <g><rect x="32" y="718" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="742" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">10</text><text x="76" y="742" font-size="16" font-weight="700" fill="#1f2230">항목 11: 3 세기 다시 세기</text><circle cx="80" cy="758" r="2" fill="#59627a"/><text x="92" y="762" font-size="12" fill="#3b4558">영어 17개라 차례대로 2개 더 확인</text></g>
  <g><rect x="32" y="796" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="820" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">11</text><text x="76" y="820" font-size="16" font-weight="700" fill="#1f2230">항목 3, 5: 도메인 기준과 질문 재료</text><circle cx="80" cy="836" r="2" fill="#59627a"/><text x="92" y="840" font-size="12" fill="#3b4558">언어마다 여러 문서 연결 12, 표·수치·조건 6</text></g>
  <g><rect x="32" y="874" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="898" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">12</text><text x="76" y="898" font-size="16" font-weight="700" fill="#1f2230">항목 4: 두 번째 소스는 찾지 않음</text><circle cx="80" cy="914" r="2" fill="#59627a"/><text x="92" y="918" font-size="12" fill="#3b4558">위키백과 하나로 과제를 채운다</text></g>
  <g><rect x="32" y="952" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="974" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">닫는 절차: 완료 기준 대조, 어드바이저</text><text x="240" y="996" font-size="12" fill="#3b4558" text-anchor="middle">기록의 어긋남 다섯을 고침(대조 2, 어드바이저 3)</text></g>
  <g><rect x="32" y="1030" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="1052" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">Codex 1차</text><text x="240" y="1074" font-size="12" fill="#3b4558" text-anchor="middle">지적 3, 모두 반영</text></g>
  <g><rect x="32" y="1108" width="416" height="56" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="1130" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">Codex 2차</text><text x="240" y="1152" font-size="12" fill="#3b4558" text-anchor="middle">1차 지적 셋 해소, 새 지적 하나(기록의 문장)를 바로 고침</text></g>
  <g><rect x="32" y="1186" width="416" height="40" rx="6" fill="#f4f5f7" stroke="#3b4558"/><text x="240" y="1212" font-size="16" font-weight="700" fill="#1f2230" text-anchor="middle">닫음</text></g>
</svg>
