<svg viewBox="0 0 480 1024" role="img" aria-labelledby="stage6-15-flow-title stage6-15-flow-desc" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="stage6-15-flow-title">답 쓰기에 근거 칸을 붙이고 잰 차례</title>
  <desc id="stage6-15-flow-desc">근거 칸의 꼴과 재는 법을 정하고 설계 검토를 받았다. 판 1은 어븀 질문을 망쳐 기준에 못 미쳤고, 원인 시험 뒤 근거 칸을 맨 앞에 두고 문서 ID로 확인하는 판 1b가 맞음 175로 정해졌다. 판 1c는 나빠져 버렸고 판 2는 돌리지 않았다. 닫는 검토 두 번을 받았다.</desc>
  <defs><marker id="s615-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4558"/></marker></defs>
  <g stroke="#3b4558" stroke-width="1.2" marker-end="url(#s615-arrow)"><line x1="240" y1="72" x2="240" y2="92"/><line x1="240" y1="150" x2="240" y2="170"/><line x1="240" y1="228" x2="240" y2="248"/><line x1="240" y1="306" x2="240" y2="326"/><line x1="240" y1="384" x2="240" y2="404"/><line x1="240" y1="462" x2="240" y2="482"/><line x1="240" y1="540" x2="240" y2="560"/><line x1="240" y1="618" x2="240" y2="638"/><line x1="240" y1="696" x2="240" y2="716"/><line x1="240" y1="774" x2="240" y2="794"/><line x1="240" y1="852" x2="240" y2="872"/><line x1="240" y1="930" x2="240" y2="950"/></g>
  <g><rect x="32" y="16" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">01</text><text x="76" y="40" font-size="16" font-weight="700" fill="#1f2230">이슈 열기</text><circle cx="80" cy="56" r="2" fill="#59627a"/><text x="92" y="60" font-size="12" fill="#3b4558">답 쓰기에 근거 칸을 더하는 서브이슈</text></g>
  <g><rect x="32" y="94" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">02</text><text x="76" y="118" font-size="16" font-weight="700" fill="#1f2230">항목 1: 그림과 확대 페이지</text><circle cx="80" cy="134" r="2" fill="#59627a"/><text x="92" y="138" font-size="12" fill="#3b4558">답 쓰기 칸을 진행 중으로, 정할 것 일곱</text></g>
  <g><rect x="32" y="172" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">03</text><text x="76" y="196" font-size="16" font-weight="700" fill="#1f2230">항목 2: 근거 칸의 꼴</text><circle cx="80" cy="212" r="2" fill="#59627a"/><text x="92" y="216" font-size="12" fill="#3b4558">사실마다 청크 번호, 틀과 코드 검사</text></g>
  <g><rect x="32" y="250" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">04</text><text x="76" y="274" font-size="16" font-weight="700" fill="#1f2230">항목 3, 4: 계획과 계산</text><circle cx="80" cy="290" r="2" fill="#59627a"/><text x="92" y="294" font-size="12" fill="#3b4558">검색 계획은 넘기지 않음, 계산은 지시문으로</text></g>
  <g><rect x="32" y="328" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">05</text><text x="76" y="352" font-size="16" font-weight="700" fill="#1f2230">항목 5: 재는 법</text><circle cx="80" cy="368" r="2" fill="#59627a"/><text x="92" y="372" font-size="12" fill="#3b4558">두 변경을 차례로 따로, 공통 검사</text></g>
  <g><rect x="32" y="406" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="430" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">06</text><text x="76" y="430" font-size="16" font-weight="700" fill="#1f2230">항목 6: Codex 설계 검토</text><circle cx="80" cy="446" r="2" fill="#59627a"/><text x="92" y="450" font-size="12" fill="#3b4558">1차 7개, 2차 1개를 고침</text></g>
  <g><rect x="32" y="484" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="508" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">07</text><text x="76" y="508" font-size="16" font-weight="700" fill="#1f2230">항목 7: 만들기</text><circle cx="80" cy="524" r="2" fill="#59627a"/><text x="92" y="528" font-size="12" fill="#3b4558">청크가 없는 사실을 검사에 더함</text></g>
  <g><rect x="32" y="562" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="586" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">08</text><text x="76" y="586" font-size="16" font-weight="700" fill="#1f2230">항목 7: 판 1을 190번</text><circle cx="80" cy="602" r="2" fill="#59627a"/><text x="92" y="606" font-size="12" fill="#3b4558">어븀 질문에서 이웃 청크, 맞음 167에서 163</text></g>
  <g><rect x="32" y="640" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="664" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">09</text><text x="76" y="664" font-size="16" font-weight="700" fill="#1f2230">항목 7: 원인 시험</text><circle cx="80" cy="680" r="2" fill="#59627a"/><text x="92" y="684" font-size="12" fill="#3b4558">근거 칸을 앞에 두고 문서 ID로 확인하면 5/5</text></g>
  <g><rect x="32" y="718" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="742" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">10</text><text x="76" y="742" font-size="16" font-weight="700" fill="#1f2230">항목 7: 판 1b를 190번</text><circle cx="80" cy="758" r="2" fill="#59627a"/><text x="92" y="762" font-size="12" fill="#3b4558">맞음 175, 나빠진 답 0</text></g>
  <g><rect x="32" y="796" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="820" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">11</text><text x="76" y="820" font-size="16" font-weight="700" fill="#1f2230">항목 7: 판 1c와 판 2</text><circle cx="80" cy="836" r="2" fill="#59627a"/><text x="92" y="840" font-size="12" fill="#3b4558">판 1c는 나빠져 버림, 판 2는 돌리지 않음</text></g>
  <g><rect x="32" y="874" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="898" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">12</text><text x="76" y="898" font-size="16" font-weight="700" fill="#1f2230">닫는 절차</text><circle cx="80" cy="914" r="2" fill="#59627a"/><text x="92" y="918" font-size="12" fill="#3b4558">대조, 어드바이저, Codex 1차, 2차</text></g>
  <g><rect x="32" y="952" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="976" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">13</text><text x="76" y="976" font-size="16" font-weight="700" fill="#1f2230">흐름 요약과 승인</text></g>
</svg>
