<svg viewBox="0 0 480 1102" role="img" aria-labelledby="stage6-12-flow-title stage6-12-flow-desc" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="stage6-12-flow-title">Baseline과 최소판을 돌리고 견준 순서</title>
  <desc id="stage6-12-flow-desc">Codex 검토 단위를 정하고 생성 프로그램을 만든 뒤 Baseline을 돌렸다. 같은 곳에서 두 번 멈춰 원인을 찾았고, 모델이 답에 0을 끝없이 쓴 실패였다. 끊긴 답을 기록하게 고쳐 380번을 마치고, Baseline 입력을 확인하고, 첫 비교와 채점 규칙 수정, 지금 설정에서 본 약점, 넘겨받은 확인 셋을 본 뒤 닫는 절차를 거쳤다.</desc>
  <defs><marker id="s612-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4558"/></marker></defs>
  <g stroke="#3b4558" stroke-width="1.2" marker-end="url(#s612-arrow)"><line x1="240" y1="72" x2="240" y2="92"/><line x1="240" y1="150" x2="240" y2="170"/><line x1="240" y1="228" x2="240" y2="248"/><line x1="240" y1="306" x2="240" y2="326"/><line x1="240" y1="384" x2="240" y2="404"/><line x1="240" y1="462" x2="240" y2="482"/><line x1="240" y1="540" x2="240" y2="560"/><line x1="240" y1="618" x2="240" y2="638"/><line x1="240" y1="696" x2="240" y2="716"/><line x1="240" y1="774" x2="240" y2="794"/><line x1="240" y1="852" x2="240" y2="872"/><line x1="240" y1="930" x2="240" y2="950"/><line x1="240" y1="1008" x2="240" y2="1028"/></g>
  <g><rect x="32" y="16" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">01</text><text x="76" y="40" font-size="16" font-weight="700" fill="#1f2230">이슈를 열기 전: Codex 검토 단위</text><circle cx="80" cy="56" r="2" fill="#59627a"/><text x="92" y="60" font-size="12" fill="#3b4558">서브이슈마다 1차·2차</text></g>
  <g><rect x="32" y="94" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">02</text><text x="76" y="118" font-size="16" font-weight="700" fill="#1f2230">항목 1: 생성 프로그램</text><circle cx="80" cy="134" r="2" fill="#59627a"/><text x="92" y="138" font-size="12" fill="#3b4558">4단계 설정 그대로, 기록 칸</text></g>
  <g><rect x="32" y="172" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">03</text><text x="76" y="196" font-size="16" font-weight="700" fill="#1f2230">항목 2: Baseline 190번</text><circle cx="80" cy="212" r="2" fill="#59627a"/><text x="92" y="216" font-size="12" fill="#3b4558">같은 곳에서 두 번 멈춤</text></g>
  <g><rect x="32" y="250" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">04</text><text x="76" y="274" font-size="16" font-weight="700" fill="#1f2230">원인 찾기</text><circle cx="80" cy="290" r="2" fill="#59627a"/><text x="92" y="294" font-size="12" fill="#3b4558">재현 두 번, 답에 0을 끝없이 씀</text></g>
  <g><rect x="32" y="328" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">05</text><text x="76" y="352" font-size="16" font-weight="700" fill="#1f2230">끊긴 답을 기록하게 고침</text><circle cx="80" cy="368" r="2" fill="#59627a"/><text x="92" y="372" font-size="12" fill="#3b4558">다시 돌림, 사이에 기록 커밋</text></g>
  <g><rect x="32" y="406" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="430" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">06</text><text x="76" y="430" font-size="16" font-weight="700" fill="#1f2230">항목 3: Baseline 입력 확인</text><circle cx="80" cy="446" r="2" fill="#59627a"/><text x="92" y="450" font-size="12" fill="#3b4558">청크와 도구 정의 없음 190/190</text></g>
  <g><rect x="32" y="484" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="508" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">07</text><text x="76" y="508" font-size="16" font-weight="700" fill="#1f2230">항목 4: 최소판 190번</text><circle cx="80" cy="524" r="2" fill="#59627a"/><text x="92" y="528" font-size="12" fill="#3b4558">끊긴 답 0</text></g>
  <g><rect x="32" y="562" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="586" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">08</text><text x="76" y="586" font-size="16" font-weight="700" fill="#1f2230">항목 5: 첫 비교</text><circle cx="80" cy="602" r="2" fill="#59627a"/><text x="92" y="606" font-size="12" fill="#3b4558">37/190 대 144/190, 채점 규칙 둘</text></g>
  <g><rect x="32" y="640" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="664" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">09</text><text x="76" y="664" font-size="16" font-weight="700" fill="#1f2230">항목 6: 지금 설정에서 본 약점</text><circle cx="80" cy="680" r="2" fill="#59627a"/><text x="92" y="684" font-size="12" fill="#3b4558">천장 92.9%, 지어내기, 계산 건너뛰기</text></g>
  <g><rect x="32" y="718" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="742" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">10</text><text x="76" y="742" font-size="16" font-weight="700" fill="#1f2230">항목 7: 넘겨받은 확인 셋</text><circle cx="80" cy="758" r="2" fill="#59627a"/><text x="92" y="762" font-size="12" fill="#3b4558">표 질문 5/5 대 0/5</text></g>
  <g><rect x="32" y="796" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="820" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">11</text><text x="76" y="820" font-size="16" font-weight="700" fill="#1f2230">닫는 절차: 문서 대조, 어드바이저</text><circle cx="80" cy="836" r="2" fill="#59627a"/><text x="92" y="840" font-size="12" fill="#3b4558">생성 프로그램 채점, 숫자 하나</text></g>
  <g><rect x="32" y="874" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="898" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">12</text><text x="76" y="898" font-size="16" font-weight="700" fill="#1f2230">Codex 1차</text><circle cx="80" cy="914" r="2" fill="#59627a"/><text x="92" y="918" font-size="12" fill="#3b4558">3개 지적, 모두 반영</text></g>
  <g><rect x="32" y="952" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="976" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">13</text><text x="76" y="976" font-size="16" font-weight="700" fill="#1f2230">Codex 2차</text><circle cx="80" cy="992" r="2" fill="#59627a"/><text x="92" y="996" font-size="12" fill="#3b4558">2개 해소, 낮음 2개는 미정으로</text></g>
  <g><rect x="32" y="1030" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="1054" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">14</text><text x="76" y="1054" font-size="16" font-weight="700" fill="#1f2230">흐름 요약과 승인</text><circle cx="80" cy="1070" r="2" fill="#59627a"/><text x="92" y="1074" font-size="12" fill="#3b4558">다음: 멘토 정리, 서브이슈 2</text></g>
</svg>
