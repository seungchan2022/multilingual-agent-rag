<svg viewBox="0 0 480 946" role="img" aria-labelledby="stage6-13-flow-title stage6-13-flow-desc" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title id="stage6-13-flow-title">워크플로우 큰 그림과 붙이는 순서를 정한 차례</title>
  <desc id="stage6-13-flow-desc">첫 비교의 약점을 다시 세고, PDF 두 고리를 뼈대로 흐름을 그렸다. 1단계 고리는 검색 계획을 만들고 1단계에서 답하지 않기로 했다. 미정 줄을 기능에 나누고 B-v2를 뺐다. 판정 뒤 답 고치기를 넣고, 1단계 고리부터 붙이는 순서를 정했다. 문서를 맞추고 닫는 절차에서 11-01 범위를 물었고, Codex 1차 지적 셋을 반영해 2차에서 모두 해소됐다.</desc>
  <defs><marker id="s613-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4558"/></marker></defs>
  <g stroke="#3b4558" stroke-width="1.2" marker-end="url(#s613-arrow)"><line x1="240" y1="72" x2="240" y2="92"/><line x1="240" y1="150" x2="240" y2="170"/><line x1="240" y1="228" x2="240" y2="248"/><line x1="240" y1="306" x2="240" y2="326"/><line x1="240" y1="384" x2="240" y2="404"/><line x1="240" y1="462" x2="240" y2="482"/><line x1="240" y1="540" x2="240" y2="560"/><line x1="240" y1="618" x2="240" y2="638"/><line x1="240" y1="696" x2="240" y2="716"/><line x1="240" y1="774" x2="240" y2="794"/><line x1="240" y1="852" x2="240" y2="872"/></g>
  <g><rect x="32" y="16" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="40" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">01</text><text x="76" y="40" font-size="16" font-weight="700" fill="#1f2230">이슈 열기</text><circle cx="80" cy="56" r="2" fill="#59627a"/><text x="92" y="60" font-size="12" fill="#3b4558">하는 일 다섯, 서브이슈 #13</text></g>
  <g><rect x="32" y="94" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="118" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">02</text><text x="76" y="118" font-size="16" font-weight="700" fill="#1f2230">항목 1: 첫 비교의 약점</text><circle cx="80" cy="134" r="2" fill="#59627a"/><text x="92" y="138" font-size="12" fill="#3b4558">원본으로 다시 셈, 46 = 35 + 11</text></g>
  <g><rect x="32" y="172" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="196" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">03</text><text x="76" y="196" font-size="16" font-weight="700" fill="#1f2230">항목 2: PDF 두 고리를 뼈대로</text><circle cx="80" cy="212" r="2" fill="#59627a"/><text x="92" y="216" font-size="12" fill="#3b4558">1단계 고리와 2단계 고리</text></g>
  <g><rect x="32" y="250" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="274" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">04</text><text x="76" y="274" font-size="16" font-weight="700" fill="#1f2230">항목 2: 1단계는 검색 계획</text><circle cx="80" cy="290" r="2" fill="#59627a"/><text x="92" y="294" font-size="12" fill="#3b4558">1단계에서 답하지 않음</text></g>
  <g><rect x="32" y="328" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="352" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">05</text><text x="76" y="352" font-size="16" font-weight="700" fill="#1f2230">항목 3: 미정 줄을 기능에 나눔</text><circle cx="80" cy="368" r="2" fill="#59627a"/><text x="92" y="372" font-size="12" fill="#3b4558">B-v2를 빼고 판정 프롬프트는 처음부터</text></g>
  <g><rect x="32" y="406" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="430" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">06</text><text x="76" y="430" font-size="16" font-weight="700" fill="#1f2230">항목 4: 판정 뒤 답 고치기</text><circle cx="80" cy="446" r="2" fill="#59627a"/><text x="92" y="450" font-size="12" fill="#3b4558">따로 재서 남길지 정함</text></g>
  <g><rect x="32" y="484" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="508" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">07</text><text x="76" y="508" font-size="16" font-weight="700" fill="#1f2230">항목 4: 1단계 고리부터</text><circle cx="80" cy="524" r="2" fill="#59627a"/><text x="92" y="528" font-size="12" fill="#3b4558">도구 호출 검색과 한 서브이슈, 따로 잼</text></g>
  <g><rect x="32" y="562" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="586" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">08</text><text x="76" y="586" font-size="16" font-weight="700" fill="#1f2230">항목 5: 문서를 맞춤</text><circle cx="80" cy="602" r="2" fill="#59627a"/><text x="92" y="606" font-size="12" fill="#3b4558">스텝퍼, 이슈 11, 미정 목록</text></g>
  <g><rect x="32" y="640" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="664" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">09</text><text x="76" y="664" font-size="16" font-weight="700" fill="#1f2230">닫는 절차: 대조와 어드바이저</text><circle cx="80" cy="680" r="2" fill="#59627a"/><text x="92" y="684" font-size="12" fill="#3b4558">11-01 범위를 물어 워크플로우 전체로</text></g>
  <g><rect x="32" y="718" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="742" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">10</text><text x="76" y="742" font-size="16" font-weight="700" fill="#1f2230">Codex 1차</text><circle cx="80" cy="758" r="2" fill="#59627a"/><text x="92" y="762" font-size="12" fill="#3b4558">보통 2, 낮음 1, 모두 반영</text></g>
  <g><rect x="32" y="796" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="820" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">11</text><text x="76" y="820" font-size="16" font-weight="700" fill="#1f2230">Codex 2차</text><circle cx="80" cy="836" r="2" fill="#59627a"/><text x="92" y="840" font-size="12" fill="#3b4558">셋 모두 해소, 새 지적 없음</text></g>
  <g><rect x="32" y="874" width="416" height="56" rx="6" fill="#ffffff" stroke="#1f2230"/><text x="48" y="898" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#59627a">12</text><text x="76" y="898" font-size="16" font-weight="700" fill="#1f2230">흐름 요약과 승인</text><circle cx="80" cy="914" r="2" fill="#59627a"/><text x="92" y="918" font-size="12" fill="#3b4558">다음: 요청 분석과 1단계 고리</text></g>
</svg>
